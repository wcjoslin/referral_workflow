# CI for the 360X referral workflow.
#
# The application lives in Projects/referral_workflow, not at the repository
# root, so every step sets working-directory. The root holds only this workflow
# and a README.
#
# Four gates, in the order a contributor would run them locally:
#
#   typecheck  tsc --noEmit equivalent via `npm run build`
#   test       the full Jest suite
#   lint       a REGRESSION BUDGET, not a clean bill of health (see below)
#   smoke      boots the server and reads the bytes a browser would get
#   pages      loads every page in a real browser and fails on a JS exception
#
# On lint: src/ carries 111 pre-existing problems. A job that ran `npm run lint`
# directly would be red from the first commit and stay red, which teaches people
# to ignore it. `npm run lint:budget` fails only when the count RISES above the
# baseline in .lint-baseline.json, so new code cannot add debt while the
# existing debt stays visible with a number on it.
#
# On smoke: the unit tests assert payloads and never render a page. Two defects
# shipped straight through them — a C-CDA panel wired to an API that does not
# exist, and page data embedded without escaping, which let a patient name close
# the script element. Both were obvious on sight. This gate exists so the next
# one is caught by a machine instead.
#
# On pages: the smoke gate reads the bytes the SERVER SENDS, and the workspace
# pages render client-side from an embedded payload — so "the bytes are right"
# and "the page works" are different claims. /workspaces/:id shipped rendering
# thirteen blank cards, because a ReferenceError aborted its render, and every
# gate above stayed green: the tests never load a view, the smoke check saw a
# byte-perfect response, and neither tsc nor eslint looks inside an inline
# <script> in a .html file. This gate executes the pages.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same PR makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Projects/referral_workflow

jobs:
  verify:
    name: build · test · lint · smoke · pages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # config.ts requires these at import time, so every step that loads the
      # app needs them present. None is reachable: no step makes an outbound
      # connection, and the smoke check inserts its fixtures directly rather
      # than seeding over IMAP/SMTP.
      IMAP_HOST: imap.invalid
      IMAP_PORT: '993'
      IMAP_USER: ci
      IMAP_PASSWORD: ci
      SMTP_HOST: smtp.invalid
      SMTP_PORT: '587'
      SMTP_USER: ci
      SMTP_PASSWORD: ci
      RECEIVING_DIRECT_ADDRESS: receiving@specialist.direct
      GEMINI_API_KEY: ci-not-a-real-key
      DATABASE_URL: ./ci-smoke.db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Projects/referral_workflow/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Test
        run: npm test

      # Runs even when the tests fail: knowing about both at once saves a cycle.
      - name: Lint budget
        if: ${{ !cancelled() }}
        run: npm run lint:budget

      - name: Migrate the smoke database
        if: ${{ !cancelled() }}
        run: npm run db:migrate

      - name: Smoke check the rendered pages
        if: ${{ !cancelled() }}
        run: npm run smoke

      # The page check needs a browser. GitHub's ubuntu images ship Google
      # Chrome, so this normally just records where it is; the apt fallback
      # keeps the gate working if that ever stops being true. It FAILS rather
      # than skipping when no browser can be obtained — a gate that quietly
      # does nothing is worse than no gate.
      - name: Locate a browser
        if: ${{ !cancelled() }}
        run: |
          for c in "$CHROME_PATH" "$CHROME_BIN" /usr/bin/google-chrome \
                   /usr/bin/google-chrome-stable /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -n "$c" ] && [ -x "$c" ]; then
              echo "CHROME_PATH=$c" >> "$GITHUB_ENV"
              echo "using $c"
              exit 0
            fi
          done
          echo "No preinstalled browser found; installing chromium."
          sudo apt-get update -qq
          sudo apt-get install -y -qq chromium-browser || sudo apt-get install -y -qq chromium
          for c in /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$c" ]; then
              echo "CHROME_PATH=$c" >> "$GITHUB_ENV"
              echo "using $c"
              exit 0
            fi
          done
          echo "Could not obtain a browser for the page check." >&2
          exit 1

      # Its own database: the page check seeds fixtures of its own, and reusing
      # the smoke database would make each gate's data depend on the other's.
      - name: Migrate the page-check database
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ./ci-pagecheck.db
        run: npm run db:migrate

      - name: Page check every page in a real browser
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ./ci-pagecheck.db
        run: npm run pagecheck
