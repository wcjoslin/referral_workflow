<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Referral</title>
<!--
  PRD-30 — the guest workspace.

  A STANDALONE DOCUMENT, not the internal page with panels hidden. There is no
  `injectNav()` call on the route that serves this, and this file contains no
  markup for owner, work status, queue, participants, internal comments or any
  other internal surface. It cannot hide what it never receives: the payload
  built by `buildGuestPayload()` has no such fields, and this page reads only
  what is in it.

  That is why it duplicates some styling from workspaceDetail.html rather than
  sharing a stylesheet. Sharing one would invite sharing a template, and a
  shared template is one CSS mistake away from showing a guest an internal
  field. The duplication is the point.

  The page also deliberately shows a guest their own scope — which organization
  they are acting for, and when their access ends — because somebody who cannot
  see why a page is sparse assumes it is broken.
-->
<style>
  :root {
    --ink: #212529; --muted: #6c757d; --line: #dee2e6; --card: #fff; --bg: #f8f9fa;
    --brand: #0d6efd; --ok: #198754; --warn: #664d03; --warn-bg: #fff3cd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e9ecef; --muted: #adb5bd; --line: #343a40; --card: #1b1e21; --bg: #121416;
      --brand: #6ea8fe; --ok: #75b798; --warn: #ffda6a; --warn-bg: #332701;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); padding: 0 16px 48px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 880px; margin: 0 auto; }

  .topbar {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    padding: 18px 0 14px; border-bottom: 1px solid var(--line); margin-bottom: 18px;
  }
  .topbar h1 { font-size: 1.05rem; margin: 0; }
  .topbar .as { font-size: 0.8rem; color: var(--muted); }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px 20px; margin-bottom: 16px;
  }
  .card h2 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em;
             color: var(--muted); margin: 0 0 12px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
  .field .label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
  .field .value { font-size: 0.92rem; margin-top: 3px; word-break: break-word; }
  .reason { grid-column: 1 / -1; }

  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 20px;
    font-size: 0.75rem; font-weight: 600; background: #e9ecef; color: #495057;
  }

  /* Timeline — same visual idea as the internal page, its own implementation. */
  .tl { display: flex; align-items: flex-start; overflow-x: auto; padding: 4px 0 2px; }
  .tl-step { display: flex; flex-direction: column; align-items: center; flex: 1; min-width: 88px; position: relative; }
  .tl-dot {
    width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--line);
    background: var(--card); z-index: 1; display: flex; align-items: center;
    justify-content: center; font-size: 0.66rem; font-weight: 700; color: var(--muted);
  }
  .tl-dot.reached { border-color: var(--ok); color: var(--ok); }
  .tl-dot.current { border-color: var(--brand); color: var(--brand); }
  .tl-step:not(:last-child)::after {
    content: ''; position: absolute; top: 13px; left: 50%; width: 100%;
    height: 3px; background: var(--line);
  }
  .tl-step.reached:not(:last-child)::after { background: var(--ok); }
  .tl-label { font-size: 0.68rem; margin-top: 7px; text-align: center; color: var(--muted); line-height: 1.3; }
  .tl-step.current .tl-label { color: var(--ink); font-weight: 600; }

  .notice {
    background: var(--warn-bg); color: var(--warn); border-radius: 8px;
    padding: 10px 14px; font-size: 0.8rem; line-height: 1.55; margin-bottom: 16px;
  }
  .soon { font-size: 0.82rem; color: var(--muted); line-height: 1.6; font-style: italic; }
  .foot { font-size: 0.74rem; color: var(--muted); line-height: 1.6; margin-top: 22px; }

  /* PRD-22. Everything on this page is shared by definition, so there is no
     visibility marker to render here — the only distinction that matters to a
     guest is whose message it is. */
  .gc { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 9px; }
  .gc-own { background: #eef6ff; border-left: 4px solid #0c63e4; }
  .gc-them { background: var(--card); border-left: 4px solid #adb5bd; }
  .gc-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .gc-who { font-size: 0.88rem; font-weight: 600; }
  .gc-meta { font-size: 0.7rem; color: var(--muted); }
  .gc-body { font-size: 0.88rem; line-height: 1.6; margin-top: 5px; white-space: pre-wrap; word-break: break-word; }
  .gc-form textarea {
    width: 100%; box-sizing: border-box; min-height: 64px; font: inherit; font-size: 0.88rem;
    padding: 8px; border: 1px solid var(--border); border-radius: 6px; resize: vertical;
  }
  .gc-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .gc-btn {
    font: inherit; font-size: 0.82rem; padding: 6px 14px; border-radius: 6px; cursor: pointer;
    background: #0c63e4; border: 1px solid #0c63e4; color: #fff;
  }
  .gc-msg { font-size: 0.78rem; min-height: 1em; }
  .gc-warn { font-size: 0.76rem; color: var(--muted); line-height: 1.55; margin-top: 8px; }

  /* PRD-23. No visibility marker and no delivery evidence here: everything a
     guest can see is shared by definition, and delivery receipts are internal
     operational detail about our own HISP. */
  .gd { border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; margin-bottom: 8px; }
  .gd-top { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
  .gd-type { font-size: 0.87rem; font-weight: 600; }
  .gd-meta { font-size: 0.72rem; color: var(--muted); margin-top: 4px; line-height: 1.5; }
  .gd-acts { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .gd-btn {
    font: inherit; font-size: 0.78rem; padding: 5px 11px; border-radius: 6px; cursor: pointer;
    background: var(--card); border: 1px solid var(--border); color: inherit; text-decoration: none;
    display: inline-block;
  }
  .gd-frame { width: 100%; height: 400px; border: 1px solid var(--border); border-radius: 6px; margin-top: 8px; background: #fff; }
  /* PRD-25. A guest's feed is protocol milestones only, so it needs no kind
     chips, no actor names and no evidence markers — all three are internal. */
  .ga { display: flex; gap: 9px; padding: 7px 0; border-top: 1px solid var(--border); }
  .ga:first-of-type { border-top: none; }
  .ga-dot { width: 7px; height: 7px; border-radius: 50%; background: #0c63e4; margin-top: 6px; flex: none; }
  .ga-line { font-size: 0.83rem; line-height: 1.45; }
  .ga-meta { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
  .gd-pre {
    margin-top: 8px; padding: 8px; border: 1px solid var(--border); border-radius: 6px;
    background: #f8f9fa; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.7rem; line-height: 1.5; max-height: 300px; overflow: auto; white-space: pre-wrap;
    word-break: break-word;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1 id="gTitle">Referral</h1>
    <span class="as" id="gAs"></span>
  </div>
  <div id="gNotice"></div>
  <div class="card" id="gHeader"></div>
  <div class="card" id="gTimeline"></div>
  <div class="card" id="gConversation"></div>
  <div class="card" id="gDocuments"></div>
  <div class="card" id="gActivity"></div>
  <div class="card" id="gCollab"></div>
  <div class="foot" id="gFoot"></div>
</div>

<script>
/*__GUEST_DATA__*/
</script>
<script>
(function () {
  'use strict';

  var P = window.__GUEST__;
  if (!P) return;

  function esc(str) {
    return String(str === null || str === undefined ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function field(label, value, extraClass) {
    return '<div class="field ' + (extraClass || '') + '">' +
      '<div class="label">' + esc(label) + '</div>' +
      '<div class="value">' + (value || '<span style="color:var(--muted)">—</span>') + '</div>' +
    '</div>';
  }

  var MODE_TEXT = {
    'native-360x': 'Your system exchanges 360X messages directly.',
    'workspace-mediated': 'You are working inside this shared referral; we render your actions into conformant 360X artifacts.',
    'local-only': 'No Direct address is on file for your organization, so updates are recorded here but not transmitted.'
  };

  document.title = 'Referral — ' + (P.workspace.patientName || 'shared with you');
  document.getElementById('gTitle').textContent =
    'Referral for ' + P.workspace.patientName;
  document.getElementById('gAs').textContent =
    'You are viewing this as ' + P.party.orgName +
    (P.guest.displayName ? ' (' + P.guest.displayName + ')' : '');

  // Say when access ends. A link that stops working without warning reads as a
  // fault; a stated expiry reads as a policy.
  var ends = new Date(P.guest.expiresAt);
  document.getElementById('gNotice').innerHTML =
    '<div class="notice">Your access to this referral ends on ' +
    esc(ends.toLocaleString()) + '. This link shows this one referral only.</div>';

  document.getElementById('gHeader').innerHTML =
    '<h2>Referral</h2>' +
    '<div class="grid">' +
      field('Patient', esc(P.workspace.patientName)) +
      field('Date of birth', esc(P.workspace.patientDob)) +
      field('360X status', '<span class="badge">' + esc(P.workspace.referralState) + '</span>') +
      field('Referring organization', esc(P.workspace.initiatingOrg)) +
      field('Receiving organization', esc(P.workspace.receivingOrg)) +
      field('Reason for referral', esc(P.workspace.reasonForReferral), 'reason') +
    '</div>';

  var steps = (P.protocolTimeline || []).map(function (s) {
    var cls = 'tl-step' + (s.reached ? ' reached' : '') + (s.current ? ' current' : '');
    var dot = 'tl-dot' + (s.reached ? ' reached' : '') + (s.current ? ' current' : '');
    return '<div class="' + cls + '">' +
      '<div class="' + dot + '">' + (s.reached ? '✓' : '') + '</div>' +
      '<div class="tl-label">' + esc(s.state) + '</div>' +
    '</div>';
  }).join('');
  document.getElementById('gTimeline').innerHTML =
    '<h2>Progress</h2><div class="tl">' + steps + '</div>';

  // ── Conversation (PRD-22) ─────────────────────────────────────────────────
  //
  // Everything here arrived through listSharedComments(), which filters on
  // visibility in SQL. An internal note is not hidden on this page; it was never
  // sent to it.

  var comments = P.sharedComments || [];

  function renderConversation() {
    var thread = comments.length === 0
      ? '<div class="soon">No messages yet. Anything you write here is visible to the ' +
        'organization that shared this referral with you.</div>'
      : comments.map(function (c) {
          return '<div class="gc ' + (c.own ? 'gc-own' : 'gc-them') + '">' +
            '<div class="gc-top">' +
              '<span class="gc-who">' + esc(c.authorDisplayName) + '</span>' +
              '<span class="gc-meta">' + esc(c.authorOrgName) + '</span>' +
              '<span class="gc-meta">' + esc(fmtDateTime(c.createdAt)) +
                (c.edited ? ' \u00b7 edited' : '') + '</span>' +
            '</div>' +
            '<div class="gc-body">' + esc(c.body) + '</div>' +
          '</div>';
        }).join('');

    document.getElementById('gConversation').innerHTML =
      '<h2>Messages</h2>' + thread +
      '<div class="gc-form">' +
        '<textarea id="gcBody" maxlength="4000" ' +
          'placeholder="Ask a question or send an update about this referral."></textarea>' +
        '<div class="gc-row">' +
          '<button class="gc-btn" id="gcPost">Send</button>' +
          '<span class="gc-msg" id="gcMsg"></span>' +
        '</div>' +
        '<div class="gc-warn">Everyone at ' + esc(P.party.orgName) + ' invited to this ' +
          'referral, and the organization that shared it with you, can read what you send. ' +
          'There is no private note on this page.</div>' +
      '</div>';

    var post = document.getElementById('gcPost');
    if (post) post.addEventListener('click', sendComment);
  }

  function fmtDateTime(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    return isNaN(d.getTime()) ? String(iso) : d.toLocaleString();
  }

  function gcMsg(text, ok) {
    var el = document.getElementById('gcMsg');
    if (!el) return;
    el.textContent = text;
    el.style.color = ok ? '#0a7d4b' : '#b02a37';
  }

  async function sendComment() {
    var ta = document.getElementById('gcBody');
    if (!ta || !ta.value.trim()) { gcMsg('Write something first.', false); return; }
    try {
      // No visibility field: a guest's comment is always shared, and the API
      // refuses a supplied value rather than coercing one.
      const res = await fetch('/api/guest/comments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ body: ta.value }),
      });
      const data = await res.json();
      if (!res.ok) { gcMsg(data.error || 'Could not send that.', false); return; }
      const reload = await fetch('/api/guest/workspace');
      const fresh = await reload.json();
      comments = reload.ok ? (fresh.sharedComments || []) : comments.concat([data.comment]);
      renderConversation();
      gcMsg('Sent.', true);
    } catch (err) {
      gcMsg('Network error.', false);
      console.warn('[Guest/Comments]', err);
    }
  }

  renderConversation();

  // ── Documents (PRD-23) ────────────────────────────────────────────────────
  //
  // Everything here came through listSharedDocuments(), which filters on BOTH
  // visibility and scope in SQL. An internal document is not hidden from this
  // page and neither is a patient-level payer document; neither was ever sent
  // to it.

  var documents = P.sharedDocuments || [];
  var openDocId = null;
  var openDocMode = null;
  var openDocBody = '';

  function renderDocuments() {
    var list = documents.length === 0
      ? '<div class="soon">No documents have been shared with you yet.</div>'
      : documents.map(function (d) {
          var open = openDocId === d.id;
          var acts = [];
          if (d.renderAs === 'ccda' || d.renderAs === 'text') {
            acts.push('<button class="gd-btn gd-open" data-id="' + esc(d.id) + '" data-mode="' +
              esc(d.renderAs) + '">' + (open ? 'Close' : 'Open') + '</button>');
          }
          acts.push('<a class="gd-btn" href="/api/guest/documents/' + esc(d.id) +
            '/content?download=1">Download</a>');

          var panel = '';
          if (open && openDocMode === 'ccda') {
            panel = '<iframe class="gd-frame" src="/guest/documents/' + esc(d.id) +
              '/ccda-frame" title="Document viewer"></iframe>';
          } else if (open && openDocMode === 'text') {
            panel = '<div class="gd-pre">' + esc(openDocBody || 'Loading\u2026') + '</div>';
          }

          return '<div class="gd">' +
            '<div class="gd-top">' +
              '<span class="gd-type">' + esc(d.docType) + '</span>' +
              (d.own ? '<span class="gd-meta">you sent this</span>' : '') +
            '</div>' +
            '<div class="gd-meta">' +
              [d.senderOrgName, fmtDateTime(d.receivedAt), d.originalFilename]
                .filter(function (x) { return !!x; }).map(esc).join(' \u00b7 ') +
            '</div>' +
            '<div class="gd-acts">' + acts.join('') + '</div>' +
            panel +
          '</div>';
        }).join('');

    document.getElementById('gDocuments').innerHTML =
      '<h2>Documents</h2>' + list +
      '<div class="gc-form">' +
        '<div class="gc-row">' +
          '<input type="file" id="gdFile" accept=".pdf,.jpg,.jpeg,.png,.xml">' +
          '<button class="gc-btn" id="gdUpload">Send a document</button>' +
          '<span class="gc-msg" id="gdMsg"></span>' +
        '</div>' +
        '<div class="gc-warn">PDF, JPEG, PNG and XML up to 20 MB. Anything you add here is ' +
          'visible to the organization that shared this referral with you.</div>' +
      '</div>';

    bindDocuments();
  }

  function gdMsg(text, ok) {
    var el = document.getElementById('gdMsg');
    if (!el) return;
    el.textContent = text;
    el.style.color = ok ? '#0a7d4b' : '#b02a37';
  }

  function bindDocuments() {
    Array.prototype.forEach.call(document.querySelectorAll('.gd-open'), function (b) {
      b.addEventListener('click', function () {
        void toggleDoc(parseInt(b.getAttribute('data-id'), 10), b.getAttribute('data-mode'));
      });
    });
    var up = document.getElementById('gdUpload');
    if (up) up.addEventListener('click', sendDocument);
  }

  async function toggleDoc(id, mode) {
    if (openDocId === id && openDocMode === mode) {
      openDocId = null;
      openDocMode = null;
      renderDocuments();
      return;
    }
    openDocId = id;
    openDocMode = mode;
    openDocBody = '';
    renderDocuments();
    if (mode === 'text') {
      try {
        const res = await fetch('/api/guest/documents/' + id + '/content');
        openDocBody = res.ok ? await res.text() : 'This document could not be displayed.';
      } catch (err) {
        openDocBody = 'This document could not be displayed.';
        console.warn('[Guest/Documents]', err);
      }
      renderDocuments();
    }
  }

  async function sendDocument() {
    var input = document.getElementById('gdFile');
    var file = input && input.files && input.files[0];
    if (!file) { gdMsg('Choose a file first.', false); return; }
    try {
      // No visibility header: a guest's document is always shared, and the API
      // refuses a supplied value rather than coercing one.
      const res = await fetch('/api/guest/documents', {
        method: 'POST',
        headers: {
          'Content-Type': file.type || 'application/octet-stream',
          'X-Document-Filename': encodeURIComponent(file.name),
        },
        body: file,
      });
      const data = await res.json();
      if (!res.ok) { gdMsg(data.error || 'Could not send that.', false); return; }
      if (input) input.value = '';
      const reload = await fetch('/api/guest/documents');
      const fresh = await reload.json();
      documents = reload.ok ? (fresh.documents || []) : documents;
      renderDocuments();
      gdMsg('Sent.', true);
    } catch (err) {
      gdMsg('Network error.', false);
      console.warn('[Guest/Documents]', err);
    }
  }

  renderDocuments();

  // ── Progress history (PRD-25) ─────────────────────────────────────────────
  //
  // Built from an allow-list of protocol milestones on the server, not the
  // internal feed with entries removed. So this page cannot show who internally
  // did what, or when somebody here opened a document — it was never sent.

  async function renderActivity() {
    var el = document.getElementById('gActivity');
    if (!el) return;
    var entries = [];
    try {
      const res = await fetch('/api/guest/activity');
      const data = await res.json();
      entries = res.ok ? (data.entries || []) : [];
    } catch (err) {
      console.warn('[Guest/Activity]', err);
    }

    el.innerHTML = '<h2>History</h2>' + (entries.length === 0
      ? '<div class="soon">Nothing has happened on this referral yet.</div>'
      : entries.map(function (e) {
          return '<div class="ga">' +
            '<div class="ga-dot"></div>' +
            '<div><div class="ga-line">' + esc(e.summary) + '</div>' +
            '<div class="ga-meta">' + esc(fmtDateTime(e.occurredAt)) + '</div></div>' +
          '</div>';
        }).join(''));
  }

  void renderActivity();

  // The assertion surface is what remains unbuilt here. Messages and documents
  // are no longer part of that list.
  var hasCollab = (P.availableAssertions || []).length > 0;

  document.getElementById('gCollab').innerHTML =
    '<h2>Your organization</h2>' +
    '<div class="grid">' +
      field('Acting for', esc(P.party.orgName)) +
      field('Role on this referral', esc(P.party.partyRole)) +
    '</div>' +
    '<div class="soon" style="margin-top:12px;">' +
      esc(MODE_TEXT[P.party.protocolMode] || P.party.protocolMode) +
    '</div>' +
    (hasCollab ? '' :
      '<div class="soon" style="margin-top:12px;">Responding to this referral from here is ' +
      'not switched on yet. Messages, documents and the progress of the referral are ' +
      'live.</div>');

  document.getElementById('gFoot').innerHTML =
    'This page shows a single referral shared with your organization. It contains no ' +
    'other patient and no internal notes from the referring organization.';
})();
</script>
</body>
</html>
