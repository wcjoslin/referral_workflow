<!--
  PRD-19 — Workspace Shell.

  The operational surface for one referral: who owns it, what happens next, what
  is available to read, what has happened. Deliberately a second page rather than
  a rewrite of /referrals/:id/review — the review page stays the focused clinical
  disposition screen, and this is free to grow panels without compromising it.

  Panel contract: each panel is a .card with a stable container id and one render
  function that owns only its own DOM. PRD-21 through PRD-25 each fill one
  reserved slot without touching the rest of the page.
-->
<meta charset="utf-8" />
<title>Workspace</title>
<style>
  :root {
    --color-nav-bg: #0d2d3a;
    --color-brand: #009aab;
    --color-brand-hover: #007d8a;
    --color-bg-page: #f0f2f5;
    --color-text: #212529;
    --color-text-muted: #6c757d;
    --color-border: #dee2e6;
    --color-card: #fff;
    --color-table-header: #f0f2f4;
    --color-badge-pending: #fff3cd;
    --color-badge-pending-text: #664d03;
    --color-badge-accepted: #d1e7dd;
    --color-badge-accepted-text: #0a3622;
    --color-badge-declined: #f8d7da;
    --color-badge-declined-text: #58151c;
    --color-priority: #dc3545;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--color-bg-page);
    color: var(--color-text);
  }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 24px 16px 64px; }
  a { color: var(--color-brand); }

  .card {
    background: var(--color-card);
    border: 1px solid var(--color-border);
    border-radius: 8px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .card h2 {
    margin: 0 0 14px;
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .field { margin-bottom: 10px; }
  .label {
    display: block;
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--color-text-muted);
    margin-bottom: 3px;
  }
  .value { font-size: 0.9rem; }
  .value.empty { color: var(--color-text-muted); font-style: italic; }

  /* ── 360X protocol status: the filled pill used everywhere else ──────────── */
  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
  .badge-received     { background: #e9ecef; color: #495057; }
  .badge-acknowledged { background: #cff4fc; color: #055160; }
  .badge-accepted     { background: var(--color-badge-accepted); color: var(--color-badge-accepted-text); }
  .badge-pending      { background: var(--color-badge-pending); color: var(--color-badge-pending-text); }
  .badge-declined     { background: var(--color-badge-declined); color: var(--color-badge-declined-text); }
  .badge-scheduled    { background: #d0efff; color: #0c63e4; }
  .badge-encounter    { background: #e2d9f3; color: #3d0a91; }
  .badge-closed       { background: var(--color-badge-accepted); color: var(--color-badge-accepted-text); }
  .badge-confirmed    { background: #badbcc; color: #0a3622; font-style: italic; }

  /*
    ── Work status: an OUTLINED chip with a leading glyph ────────────────────
    AC5 is explicit that these must not read as two instances of the same pill.
    Square corners, a border rather than a fill, and a glyph — so the two status
    dimensions are never confused at a glance.
  */
  .ws-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px;
    border-radius: 4px;
    border: 1.5px solid currentColor;
    background: transparent;
    font-size: 0.75rem;
    font-weight: 700;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
  }
  .ws-chip::before { content: '\25C7'; font-size: 0.7rem; }
  .ws-triage             { color: #6c757d; }
  .ws-in-progress        { color: #0c63e4; }
  .ws-waiting-external   { color: #997404; }
  .ws-waiting-internal   { color: #6f42c1; }
  .ws-follow-up-required { color: #bd5800; }
  .ws-exception          { color: var(--color-priority); }
  .ws-resolved           { color: #0a7d4b; }

  .status-pair { display: flex; gap: 32px; flex-wrap: wrap; align-items: flex-start; }
  .status-block { min-width: 190px; }
  .status-explain { font-size: 0.72rem; color: var(--color-text-muted); margin-top: 5px; max-width: 260px; line-height: 1.45; }

  /* PRD-28 — the exception panel. */
  .exc-panel { margin-top: 18px; padding: 14px 16px; border-radius: 8px; background: #fff5f5;
               border-left: 3px solid #dc3545; }
  .exc-item { padding: 8px 0; border-bottom: 1px solid #f8d7da; }
  .exc-item:last-child { border-bottom: none; }
  .exc-type { display: inline-block; font-size: 0.66rem; font-weight: 700; letter-spacing: 0.04em;
              text-transform: uppercase; background: #f8d7da; color: #58151c; border-radius: 20px;
              padding: 2px 9px; margin-right: 8px; }
  .exc-sum { font-size: 0.9rem; font-weight: 600; margin: 4px 0 2px; line-height: 1.4; }
  .exc-rem { font-size: 0.8rem; color: #664d03; }

  /* PRD-26 — next action, due date, awaited-by. */
  .na-block { margin-top: 18px; padding: 14px 16px; border-radius: 8px;
              background: #f8f9fa; border-left: 3px solid var(--color-brand); }
  .na-block.na-overdue { background: #fff5f5; border-left-color: #dc3545; }
  .na-top { display: flex; align-items: center; gap: 10px; }
  .na-text { font-size: 0.98rem; font-weight: 600; margin: 6px 0 4px; line-height: 1.4; }
  .na-due { font-size: 0.85rem; margin-bottom: 4px; }
  .na-due .label { margin-right: 6px; }
  .due-ok { color: var(--color-text); }
  .due-over { color: #dc3545; font-weight: 700; }
  .na-mark { display: inline-block; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.04em;
             background: #e0e7ff; color: #3730a3; border-radius: 20px; padding: 2px 8px;
             margin-left: 8px; vertical-align: middle; cursor: help; }
  .await { display: inline-block; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.03em;
           border-radius: 20px; padding: 3px 10px; }
  .await-us { background: #cfe2ff; color: #084298; }
  .await-party { background: #fff3cd; color: #664d03; }
  .await-none { background: #e9ecef; color: #495057; }
  .status-meta { font-size: 0.7rem; color: var(--color-text-muted); margin-top: 4px; }

  .hdr-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap; }
  .hdr-title { font-size: 1.3rem; font-weight: 700; margin: 0 0 3px; }
  .hdr-sub { font-size: 0.82rem; color: var(--color-text-muted); }
  /*
    The reason is prose and can run to a paragraph, so it gets its own
    full-width row. Inside the auto-fit grid below it made one cell tall enough
    to leave the other six looking like dead space.
  */
  .hdr-reason {
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--color-border);
    max-width: 78ch;
  }
  .hdr-reason .value { line-height: 1.55; }
  .hdr-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px 20px;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--color-border);
    align-items: start;
  }

  .banner { border-radius: 6px; padding: 10px 14px; font-size: 0.85rem; margin-bottom: 14px; }
  .banner-archived { background: #e9ecef; color: #495057; border-left: 4px solid #6c757d; }
  .banner-exception { background: var(--color-badge-declined); color: var(--color-badge-declined-text); border-left: 4px solid var(--color-priority); }
  .banner-priority { background: var(--color-badge-pending); color: var(--color-badge-pending-text); border-left: 4px solid #ffc107; }

  .btn {
    font-size: 0.8rem;
    padding: 5px 12px;
    border: 1px solid var(--color-border);
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
    font-weight: 600;
    color: var(--color-text);
  }
  .btn:hover:not(:disabled) { background: #f1f3f5; }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .btn-primary { background: var(--color-brand); border-color: var(--color-brand); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--color-brand-hover); }
  select.ctl {
    font-size: 0.8rem;
    padding: 5px 8px;
    border: 1px solid var(--color-border);
    border-radius: 4px;
    background: #fff;
  }
  .ctl-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .msg { font-size: 0.78rem; margin-top: 8px; min-height: 1em; }
  .msg.ok { color: #0a7d4b; }
  .msg.err { color: var(--color-priority); }

  /* ── Protocol assertions (PRD-29) ─────────────────────────────────────────── */
  .asrt { border: 1px solid var(--color-border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .asrt-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .asrt-label { font-size: 0.9rem; font-weight: 600; }
  .asrt-desc { font-size: 0.78rem; color: var(--color-text-muted); margin-top: 3px; line-height: 1.5; }
  .asrt-ctx { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .asrt-none { font-size: 0.82rem; color: var(--color-text-muted); font-style: italic; }
  .hist { list-style: none; padding: 0; margin: 8px 0 0; }
  .hist li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--color-border); flex-wrap: wrap; font-size: 0.8rem; }
  .hist li:first-child { border-top: none; }
  .del-transmitted { background: var(--color-badge-accepted); color: var(--color-badge-accepted-text); }
  .del-local { background: #fff3cd; color: #664d03; }
  .del-failed { background: var(--color-badge-declined); color: var(--color-badge-declined-text); }

  /* ── Parties & participants (PRD-24) ──────────────────────────────────────── */
  .party { border: 1px solid var(--color-border); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .party-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .party-name { font-size: 0.95rem; font-weight: 600; }
  .party-role {
    font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 2px 7px; border-radius: 4px; background: #e9ecef; color: #495057;
  }
  .party-role.initiating { background: #cff4fc; color: #055160; }
  .party-role.receiving { background: var(--color-badge-accepted); color: var(--color-badge-accepted-text); }
  .tag {
    font-size: 0.66rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 2px 6px; border-radius: 4px; background: #fff3cd; color: #664d03;
  }
  .tag.verified { background: #d1e7dd; color: #0a3622; }
  .tag.assumed { background: #e9ecef; color: #495057; }
  .party-addr { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.78rem; color: var(--color-text-muted); margin-top: 4px; word-break: break-all; }
  .party-mode { font-size: 0.78rem; margin-top: 6px; line-height: 1.5; }
  .party-extra { font-size: 0.74rem; color: var(--color-text-muted); margin-top: 6px; line-height: 1.5; }
  .plist { list-style: none; padding: 0; margin: 4px 0 0; }
  .plist li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--color-border); flex-wrap: wrap; }
  .plist li:first-child { border-top: none; }
  .p-name { font-size: 0.88rem; font-weight: 600; }
  .p-meta { font-size: 0.74rem; color: var(--color-text-muted); }
  .p-role { font-size: 0.7rem; font-weight: 700; padding: 2px 7px; border-radius: 4px; background: #e9ecef; color: #495057; }
  .p-spacer { flex: 1; }
  .btn-x { background: none; border: none; color: var(--color-text-muted); cursor: pointer; font-size: 0.95rem; padding: 2px 6px; line-height: 1; }
  .btn-x:hover { color: var(--color-priority); }
  .subhead { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-text-muted); margin: 16px 0 6px; }
  .empty-note { font-size: 0.8rem; color: var(--color-text-muted); font-style: italic; }

  /*
    PRD-22. Internal and shared comments must be UNMISTAKABLY different, and by
    more than colour: each carries an explicit worded label, a different border
    treatment and a different background, so the distinction survives
    colour-blindness, a greyscale print and a bad monitor.
  */
  .cmt { border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; border: 1px solid var(--color-border); }
  .cmt-internal { background: var(--color-card); border-left: 4px solid #6c757d; }
  .cmt-shared { background: #fff8e6; border-left: 4px double #bd5800; border-top-style: dashed; }
  .cmt-deleted { background: #f1f3f5; border-left: 4px dotted #adb5bd; }
  .cmt-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .cmt-author { font-size: 0.9rem; font-weight: 600; }
  .cmt-meta { font-size: 0.72rem; color: var(--color-text-muted); }
  .cmt-vis {
    font-size: 0.66rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    padding: 2px 7px; border-radius: 4px; white-space: nowrap;
  }
  .cmt-vis-internal { background: #e9ecef; color: #343a40; }
  .cmt-vis-shared { background: #bd5800; color: #fff; }
  .cmt-body { font-size: 0.88rem; line-height: 1.6; margin-top: 6px; white-space: pre-wrap; word-break: break-word; }
  .cmt-gone { font-size: 0.82rem; color: var(--color-text-muted); font-style: italic; margin-top: 6px; }
  .cmt-mentions { font-size: 0.74rem; color: var(--color-text-muted); margin-top: 6px; }
  .cmt-acts { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .cmt-hist { font-size: 0.74rem; margin-top: 8px; border-top: 1px solid var(--color-border); padding-top: 6px; }
  .cmt-hist div { padding: 3px 0; line-height: 1.5; }
  .cmt-edit-area { width: 100%; box-sizing: border-box; margin-top: 6px; }

  .cmp { border: 1px solid var(--color-border); border-radius: 8px; padding: 10px 12px; margin-top: 4px; }
  .cmp textarea {
    width: 100%; box-sizing: border-box; min-height: 68px; font: inherit; font-size: 0.88rem;
    padding: 8px; border: 1px solid var(--color-border); border-radius: 6px; resize: vertical;
  }
  .cmp-count { font-size: 0.7rem; color: var(--color-text-muted); }
  .chip {
    display: inline-flex; align-items: center; gap: 4px; font-size: 0.74rem;
    background: #e7f1ff; color: #0c63e4; border-radius: 12px; padding: 2px 4px 2px 9px; margin: 0 4px 4px 0;
  }
  .chip button { background: none; border: none; color: inherit; cursor: pointer; font-size: 0.85rem; line-height: 1; padding: 0 3px; }
  /*
    The share confirmation. Deliberately loud, deliberately in words: it names
    who will be able to read the comment rather than saying "are you sure?".
  */
  .share-warn {
    margin-top: 8px; padding: 10px 12px; border-radius: 6px;
    background: #fff3cd; color: #664d03; border-left: 4px solid #ffc107; font-size: 0.8rem; line-height: 1.55;
  }
  .share-warn ul { margin: 6px 0 0; padding-left: 20px; }
  .share-warn label { display: flex; gap: 7px; align-items: flex-start; margin-top: 8px; font-weight: 600; cursor: pointer; }
  .mention-flag { font-size: 0.74rem; color: #bd5800; margin-top: 6px; }

  /* PRD-23. Delivery and access are two different facts and are laid out as
     two, never merged into one "seen" indicator. */
  .doc { border: 1px solid var(--color-border); border-radius: 8px; padding: 9px 11px; margin-bottom: 8px; }
  .doc-patient { border-left: 4px dashed #997404; background: #fffbf0; }
  .doc-top { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
  .doc-type { font-size: 0.87rem; font-weight: 600; }
  .doc-meta { font-size: 0.72rem; color: var(--color-text-muted); margin-top: 4px; line-height: 1.5; }
  .doc-src {
    font-size: 0.64rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 2px 6px; border-radius: 4px; background: #e9ecef; color: #343a40; white-space: nowrap;
  }
  .doc-src-inbound  { background: #cff4fc; color: #055160; }
  .doc-src-outbound { background: #d1e7dd; color: #0a3622; }
  .doc-src-payer    { background: #e2d9f3; color: #3d0a91; }
  .doc-src-upload   { background: #e7f1ff; color: #0c63e4; }
  .doc-evidence { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 7px; }
  .doc-fact { font-size: 0.72rem; line-height: 1.45; }
  .doc-fact .k {
    display: block; font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--color-text-muted); font-weight: 700;
  }
  .doc-acts { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .doc-pre {
    margin-top: 8px; padding: 8px; border: 1px solid var(--color-border); border-radius: 6px;
    background: #f8f9fa; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.7rem; line-height: 1.5; max-height: 320px; overflow: auto; white-space: pre-wrap;
    word-break: break-word;
  }
  .doc-frame { width: 100%; height: 420px; border: 1px solid var(--color-border); border-radius: 6px; margin-top: 8px; background: #fff; }
  .doc-log { list-style: none; padding: 0; margin: 8px 0 0; font-size: 0.72rem; }
  .doc-log li { padding: 4px 0; border-top: 1px solid var(--color-border); }
  .doc-filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .doc-upload { border-top: 1px solid var(--color-border); margin-top: 12px; padding-top: 10px; }
  .doc-note { font-size: 0.72rem; color: var(--color-text-muted); line-height: 1.5; margin-top: 6px; }

  /* PRD-25. Kind is a border colour AND a worded chip, never colour alone. */
  .act-tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
  .act-tab {
    font: inherit; font-size: 0.74rem; padding: 4px 10px; border-radius: 14px; cursor: pointer;
    background: var(--color-card); border: 1px solid var(--color-border); color: inherit;
  }
  .act-tab.on { background: var(--color-brand); border-color: var(--color-brand); color: #fff; }
  .act-tab .n { opacity: 0.7; margin-left: 3px; }
  .act { display: flex; gap: 9px; padding: 8px 0; border-top: 1px solid var(--color-border); }
  .act:first-of-type { border-top: none; }
  .act-rail { width: 3px; border-radius: 2px; flex: none; background: #adb5bd; }
  .act-system   .act-rail { background: #adb5bd; }
  .act-user     .act-rail { background: #0c63e4; }
  .act-guest    .act-rail { background: #bd5800; }
  .act-status   .act-rail { background: #6f42c1; }
  .act-delivery .act-rail { background: #0a7d4b; }
  .act-access   .act-rail { background: #997404; }
  .act-body { flex: 1; min-width: 0; }
  .act-line { font-size: 0.83rem; line-height: 1.45; }
  .act-meta { font-size: 0.7rem; color: var(--color-text-muted); margin-top: 3px; line-height: 1.5; }
  .act-chip {
    font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    padding: 1px 6px; border-radius: 3px; background: #e9ecef; color: #343a40; white-space: nowrap;
  }
  .act-ev-delivery { background: #d1e7dd; color: #0a3622; }
  .act-ev-access { background: #fff3cd; color: #664d03; }
  .act-transition { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.7rem; }

  .cols { display: grid; grid-template-columns: 1fr; gap: 16px; }
  .cols.with-viewer { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
  @media (max-width: 980px) { .cols.with-viewer { grid-template-columns: 1fr; } }
  .viewer-col { position: sticky; top: 76px; align-self: start; }

  /* ── Protocol timeline, ported from the review page ─────────────────────── */
  .tl { display: flex; align-items: flex-start; overflow-x: auto; padding: 4px 0 2px; }
  .tl-step { display: flex; flex-direction: column; align-items: center; flex: 1; min-width: 90px; position: relative; }
  .tl-dot { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--color-border); background: var(--color-card); display: flex; align-items: center; justify-content: center; z-index: 1; font-size: 0.7rem; font-weight: 700; color: #adb5bd; }
  .tl-dot.active { border-color: #198754; background: #198754; color: #fff; }
  .tl-dot.current { border-color: #0d6efd; background: #0d6efd; color: #fff; box-shadow: 0 0 0 4px rgba(13,110,253,.25); }
  .tl-dot.declined { border-color: var(--color-priority); background: var(--color-priority); color: #fff; }
  .tl-dot.noshown { border-color: #fd7e14; background: #fd7e14; color: #fff; }
  .tl-label { font-size: 0.72rem; font-weight: 600; color: var(--color-text-muted); margin-top: 6px; text-align: center; }
  .tl-connector { position: absolute; top: 14px; left: 50%; width: 100%; height: 3px; background: var(--color-border); z-index: 0; }
  .tl-connector.active { background: #198754; }
  .tl-step:last-child .tl-connector { display: none; }

  /* ── Message thread, ported from the review page ────────────────────────── */
  .thread-container { display: flex; flex-direction: column; gap: 0; }
  .thread-count { font-size: 0.75rem; font-weight: 400; color: var(--color-text-muted); margin-left: 6px; }
  .thread-entry { border-left: 4px solid var(--color-border); padding: 12px 16px; cursor: pointer; transition: background 0.15s; }
  .thread-entry:not(:last-child) { border-bottom: 1px solid var(--color-border); }
  .thread-entry:hover { background: #f8f9fa; }
  .thread-entry.inbound { border-left-color: #198754; }
  .thread-entry.outbound { border-left-color: #0d6efd; }
  .thread-header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .thread-arrow { font-size: 0.7rem; color: var(--color-text-muted); transition: transform 0.15s; min-width: 12px; }
  .thread-entry.expanded .thread-arrow { transform: rotate(90deg); }
  .thread-dir-badge { font-size: 0.68rem; font-weight: 700; padding: 1px 6px; border-radius: 3px; text-transform: uppercase; letter-spacing: 0.04em; }
  .thread-dir-badge.inbound { background: #d1e7dd; color: #0a3622; }
  .thread-dir-badge.outbound { background: #cfe2ff; color: #084298; }
  .thread-type { font-size: 0.82rem; font-weight: 600; color: var(--color-text); }
  .thread-time { font-size: 0.75rem; color: #999; margin-left: auto; white-space: nowrap; }
  .thread-ack { font-size: 0.68rem; font-weight: 600; padding: 1px 6px; border-radius: 3px; }
  .thread-ack.acked { background: #d1e7dd; color: #0a3622; }
  .thread-ack.pending { background: #fff3cd; color: #664d03; }
  .thread-summary { font-size: 0.85rem; color: var(--color-text-muted); margin-top: 4px; }
  .thread-body { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--color-border); }
  .thread-entry.expanded .thread-body { display: block; }
  .thread-body-text { font-size: 0.88rem; white-space: pre-wrap; line-height: 1.6; background: #f8f9fa; padding: 12px; border-radius: 6px; max-height: 300px; overflow-y: auto; }
  .thread-body-hl7 { font-family: 'Courier New', monospace; font-size: 0.78rem; white-space: pre-wrap; background: #1e1e1e; color: #d4d4d4; padding: 12px; border-radius: 6px; max-height: 300px; overflow-y: auto; }
  .thread-no-content { font-size: 0.82rem; color: #999; font-style: italic; }

  .document-list { list-style: none; margin: 0; padding: 0; }
  .document-list li { padding: 8px 0; border-bottom: 1px solid var(--color-border); font-size: 0.85rem; display: flex; gap: 10px; align-items: baseline; }
  .document-list li:last-child { border-bottom: none; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 0.75rem; background: var(--color-table-header); border: 1px solid var(--color-border); border-radius: 12px; padding: 2px 9px; }

  /* ── Owner panel (PRD-21) ────────────────────────────────────────────────── */
  .owner-now { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .owner-name { font-size: 0.95rem; font-weight: 600; }
  .owner-none { font-size: 0.95rem; color: var(--color-text-muted); font-style: italic; }
  .owner-inactive-tag {
    font-size: 0.62rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    color: #997404; border: 1px solid #997404; border-radius: 3px; padding: 1px 4px;
  }
  .owner-you {
    font-size: 0.62rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    color: #0a7d4b; border: 1px solid #0a7d4b; border-radius: 3px; padding: 1px 4px;
  }
  .owner-hint { font-size: 0.72rem; color: var(--color-text-muted); margin-top: 6px; line-height: 1.45; }

  /* Reserved panels. Rendered, not absent — so the layout is the real layout. */
  .slot-empty {
    font-size: 0.82rem;
    color: var(--color-text-muted);
    background: repeating-linear-gradient(45deg, #fafbfc, #fafbfc 8px, #f4f6f8 8px, #f4f6f8 16px);
    border: 1px dashed var(--color-border);
    border-radius: 6px;
    padding: 16px;
    text-align: center;
  }
  .slot-tag {
    display: inline-block;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--color-text-muted);
    border: 1px solid var(--color-border);
    border-radius: 3px;
    padding: 1px 5px;
    margin-left: auto;
  }
  #ccdaContainer { width: 100%; height: 720px; border: none; display: block; background: #fff; }
</style>

<!--__NAV__-->

<div class="wrap">
  <div id="wsBanners"></div>
  <div class="card" id="wsHeader"></div>

  <div class="cols" id="wsCols">
    <div>
      <div class="card" id="wsTimeline"></div>
      <!--
        Ownership lives in the MAIN column, high up, because it is an action
        about the work rather than reference material — and because when a
        referral has no C-CDA the layout collapses to one column and the side
        column stacks after everything in this one. PRD-19 originally put this
        slot in the side column; filling it in PRD-21 showed the consequence:
        the claim and release controls sat a thousand pixels down, beneath three
        empty placeholder panels.
      -->
      <div class="card" id="wsAssertions"></div>
      <div class="card" id="wsOwner"></div>
      <!--
        Parties & participants also sits in the MAIN column, but for a different
        reason than ownership above. Ownership moved because it is the primary
        ACTION and was buried. This panel is mostly reference material, which
        would normally justify the side column — except AC1's whole story is
        "see who I am dealing with WITHOUT opening the raw message", and in the
        single-column collapse the side column stacks after the message thread,
        which can run to any length. Reference material you are meant to see on
        arrival cannot live below an unbounded list.
      -->
      <div class="card" id="wsParticipants"></div>
      <div class="card" id="wsConversation"></div>
      <div class="card" id="wsThread"></div>
      <div class="card" id="wsActivity"></div>
    </div>
    <div class="viewer-col" id="wsSide">
      <div class="card" id="wsRouting"></div>
      <div class="card" id="wsClinical"></div>
      <div class="card" id="wsDocuments"></div>
      <div class="card" id="wsPriorAuth"></div>
      <div class="card" id="wsCcdaPanel"></div>
    </div>
  </div>
</div>

<script>
  /*__WORKSPACE_DATA__*/
</script>
<script>
(function () {
  'use strict';

  var P = window.__WORKSPACE_DATA__;
  var ws = P.workspace;
  var ref = P.referral;

  // Every interpolated database string goes through this. Several existing views
  // interpolate unescaped; this page does not add to that.
  function esc(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /** AC2: an absent value is an explicit empty state, never blank or undefined. */
  function orEmpty(value, placeholder) {
    if (value === null || value === undefined || value === '') {
      return '<span class="value empty">' + esc(placeholder || '—') + '</span>';
    }
    return '<span class="value">' + esc(value) + '</span>';
  }

  function field(label, value, placeholder) {
    return '<div class="field"><span class="label">' + esc(label) + '</span>' +
      orEmpty(value, placeholder) + '</div>';
  }

  function protocolBadge(state) {
    var map = {
      'Received': 'received', 'Acknowledged': 'acknowledged', 'Accepted': 'accepted',
      'Pending-Information': 'pending', 'Declined': 'declined', 'Scheduled': 'scheduled',
      'No-Show': 'pending', 'Encounter': 'encounter', 'Closed': 'closed',
      'Closed-Confirmed': 'confirmed', 'Consult': 'encounter'
    };
    return '<span class="badge badge-' + (map[state] || 'received') + '">' + esc(state) + '</span>';
  }

  function workChip(status) {
    var cls = 'ws-' + String(status).toLowerCase();
    return '<span class="ws-chip ' + cls + '">' + esc(status) + '</span>';
  }

  function fmtDate(iso) {
    if (!iso) return null;
    var d = new Date(iso);
    if (isNaN(d.getTime())) return null;
    return d.toLocaleString(undefined, {
      year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
    });
  }

  function fmtDay(iso) {
    if (!iso) return null;
    var d = new Date(iso);
    return isNaN(d.getTime()) ? null : d.toLocaleDateString();
  }

  // ── Banners ───────────────────────────────────────────────────────────────

  function renderBanners() {
    var out = '';
    if (ws.archivedAt) {
      out += '<div class="banner banner-archived"><strong>Archived</strong> ' +
        esc(fmtDate(ws.archivedAt) || '') +
        ' — this workspace is read-only. The 360X status is unaffected by archival.</div>';
    }
    if (ws.workStatus === 'Exception') {
      out += '<div class="banner banner-exception"><strong>Exception</strong> — ' +
        esc(ws.exceptionReason || 'no reason recorded') + '</div>';
    }
    if (ref.priorityFlag) {
      out += '<div class="banner banner-priority"><strong>Priority</strong> — ' +
        'flagged for expedited handling.</div>';
    }
    document.getElementById('wsBanners').innerHTML = out;
  }

  // ── Header (AC1, AC2, AC5, AC6, AC7, AC7a, AC8) ───────────────────────────

  // ── PRD-28: open exceptions ───────────────────────────────────────────────

  /**
   * AC22. Shown at the TOP of the header, above the next action, because an
   * unplaced artifact against this referral outranks whatever the rule table
   * says to do next — and because the work status reads `Exception` and a
   * coordinator needs to know why without leaving the page.
   */
  function exceptionPanel() {
    var list = (window.__WORKSPACE_DATA__ && window.__WORKSPACE_DATA__.exceptions) || [];
    if (!list.length) return '';

    return '<div class="exc-panel">' +
      '<span class="label">' + list.length +
        (list.length === 1 ? ' open exception' : ' open exceptions') + '</span>' +
      list.map(function (e) {
        return '<div class="exc-item">' +
          '<div><span class="exc-type">' + esc(e.exceptionType) + '</span>' +
            '<span class="muted" style="font-size:0.76rem;">' +
              esc(e.ageHours < 1 ? 'just now' : e.ageHours + 'h old') + '</span></div>' +
          '<div class="exc-sum">' + esc(e.summary) + '</div>' +
          (e.remediation ? '<div class="exc-rem">' + esc(e.remediation) + '</div>' : '') +
        '</div>';
      }).join('') +
      '<div class="status-explain" style="max-width:none;">Work on these in the ' +
        '<a href="/exceptions">exception queue</a>, which holds the retained artifact and the ' +
        'reassociation controls. Resolving them all returns the work status to what it was before ' +
        'the first one was raised.</div>' +
    '</div>';
  }

  // ── PRD-26: next action, due date, and who owes the move ──────────────────

  /**
   * Relative wording computed HERE, in the browser, from the absolute
   * timestamp — never rendered server-side. A cached page would otherwise show
   * a stale "due in 2 hours" that is quietly wrong, and the whole point of the
   * field is that a coordinator can trust it at a glance.
   */
  function relativeDue(iso) {
    if (!iso) return '';
    var due = new Date(iso).getTime();
    if (isNaN(due)) return '';
    var diffMs = due - Date.now();
    var past = diffMs < 0;
    var mins = Math.round(Math.abs(diffMs) / 60000);
    var text;
    if (mins < 60) text = mins + (mins === 1 ? ' minute' : ' minutes');
    else if (mins < 60 * 48) {
      var hrs = Math.round(mins / 60);
      text = hrs + (hrs === 1 ? ' hour' : ' hours');
    } else {
      var days = Math.round(mins / 1440);
      text = days + (days === 1 ? ' day' : ' days');
    }
    return past ? text + ' overdue' : 'due in ' + text;
  }

  /** Who owes the move, naming the organization rather than "external". */
  function awaitedLabel() {
    if (ws.awaitedBy === 'party') {
      return '<span class="await await-party">Awaiting ' +
        esc(ws.awaitedByPartyOrgName || 'the counterparty') + '</span>';
    }
    if (ws.awaitedBy === 'nobody') {
      return '<span class="await await-none">Awaiting nobody</span>';
    }
    return '<span class="await await-us">Awaiting us</span>';
  }

  function nextActionBlock() {
    var rel = relativeDue(ws.nextActionDueAt);
    var dueLine = ws.nextActionDueAt
      ? '<span class="' + (ws.overdue ? 'due-over' : 'due-ok') + '">' +
          esc(fmtDate(ws.nextActionDueAt) || '') +
          (rel ? ' &middot; ' + esc(rel) : '') +
        '</span>'
      : '<span class="muted">No due date</span>';

    var marks =
      (ws.nextActionSetBy
        ? '<span class="na-mark" title="Written by a person; a recompute keeps it until the rule changes">SET BY ' +
            esc(ws.nextActionSetBy) + '</span>'
        : '') +
      (ws.dueDateOverridden
        ? '<span class="na-mark" title="' +
            esc(ws.dueDateOverrideReason || 'Overridden') +
            '">DUE DATE OVERRIDDEN</span>'
        : '');

    var controls = readOnly ? '' :
      '<div class="ctl-row" style="margin-top:10px;">' +
        '<input class="ctl" id="naInput" placeholder="Replace the next action…" ' +
          'maxlength="500" style="min-width:300px;" />' +
        '<button class="btn" id="btnSetNextAction">Set action</button>' +
      '</div>' +
      '<div class="ctl-row" style="margin-top:6px;">' +
        '<input class="ctl" id="dueInput" type="datetime-local" />' +
        '<input class="ctl" id="dueReason" placeholder="Reason (required)" style="min-width:200px;" />' +
        '<button class="btn" id="btnSetDue">Override due date</button>' +
        ((ws.nextActionSetBy || ws.dueDateOverridden)
          ? '<button class="btn" id="btnClearOverrides" title="Restore the computed action and due date">Reset to rule</button>'
          : '') +
      '</div>';

    return '<div class="na-block' + (ws.overdue ? ' na-overdue' : '') + '">' +
      '<div class="na-top">' +
        '<span class="label">Next action</span>' + awaitedLabel() +
      '</div>' +
      '<div class="na-text">' + esc(ws.nextAction || 'None set') + marks + '</div>' +
      '<div class="na-due"><span class="label">Due</span> ' + dueLine + '</div>' +
      '<div class="status-explain">Computed from the protocol state and the work status when either ' +
        'changes. Offsets are elapsed hours &mdash; there is no business-hours or holiday awareness, ' +
        'so these are working defaults rather than contractual SLAs.</div>' +
      controls +
      '<div class="msg" id="naMsg"></div>' +
    '</div>';
  }

  function wireNextAction() {
    if (readOnly) return;
    var setBtn = document.getElementById('btnSetNextAction');
    if (setBtn) setBtn.addEventListener('click', async function () {
      var v = document.getElementById('naInput').value.trim();
      if (!v) { naMsg('Enter an action first.', false); return; }
      var r = await post('/api/workspaces/' + ws.id + '/next-action', { nextAction: v });
      if (r.ok) location.reload(); else naMsg(r.json.error || 'Failed.', false);
    });

    var dueBtn = document.getElementById('btnSetDue');
    if (dueBtn) dueBtn.addEventListener('click', async function () {
      var raw = document.getElementById('dueInput').value;
      var reason = document.getElementById('dueReason').value.trim();
      if (!raw) { naMsg('Pick a date and time first.', false); return; }
      if (!reason) { naMsg('A reason is required to override a due date.', false); return; }
      var r = await post('/api/workspaces/' + ws.id + '/due-date',
        { dueAt: new Date(raw).toISOString(), reason: reason });
      if (r.ok) location.reload(); else naMsg(r.json.error || 'Failed.', false);
    });

    var clearBtn = document.getElementById('btnClearOverrides');
    if (clearBtn) clearBtn.addEventListener('click', async function () {
      var r = await post('/api/workspaces/' + ws.id + '/next-action', { clear: true });
      if (r.ok) location.reload(); else naMsg(r.json.error || 'Failed.', false);
    });
  }

  function naMsg(text, ok) {
    var el = document.getElementById('naMsg');
    if (!el) return;
    el.className = 'msg ' + (ok ? 'ok' : 'err');
    el.textContent = text;
  }

  function renderHeader() {
    var patientName = (P.patient.firstName + ' ' + P.patient.lastName).trim();
    var readOnly = !!ws.archivedAt;

    // AC7: only transitions the machine permits from the current status.
    var opts = (ws.allowedWorkStatuses || []).map(function (s) {
      return '<option value="' + esc(s) + '">' + esc(s) + '</option>';
    }).join('');

    var manualNote = ws.workStatusIsManual
      ? 'Held by ' + esc(ws.workStatusSetBy || 'someone') +
        (ws.workStatusSetAt ? ' on ' + esc(fmtDate(ws.workStatusSetAt) || '') : '') +
        '. The protocol mapping will not change it.'
      : 'Following the 360X protocol mapping.';

    // AC7a: the resync action exists exactly when a person is holding the status.
    // Without it the UI can reach a state it cannot leave.
    var resyncBtn = (ws.workStatusIsManual && !readOnly)
      ? '<button class="btn" id="btnResync" title="Clear the manual hold and re-apply the protocol mapping">' +
        '↻ Follow protocol again</button>'
      : '';

    document.getElementById('wsHeader').innerHTML =
      '<div class="hdr-top">' +
        '<div>' +
          '<h1 class="hdr-title">' + esc(patientName || 'Unknown patient') + '</h1>' +
          '<div class="hdr-sub">DOB ' + esc(P.patient.dateOfBirth || '—') +
            ' · Referral #' + esc(ref.id) + ' · Workspace #' + esc(ws.id) + '</div>' +
        '</div>' +
        '<div style="display:flex;gap:8px;align-items:center;">' +
          '<a class="btn" href="/referrals/' + encodeURIComponent(ref.id) + '/review">' +
            'Clinical disposition screen →</a>' +
        '</div>' +
      '</div>' +

      '<div class="status-pair" style="margin-top:18px;">' +
        '<div class="status-block">' +
          '<span class="label">360X Status</span>' +
          protocolBadge(ref.state) +
          '<div class="status-explain">What the counterparty has been told. Externally ' +
            'authoritative — it changes only through protocol actions, never from this page.</div>' +
        '</div>' +
        '<div class="status-block">' +
          '<span class="label">Work Status</span>' +
          workChip(ws.workStatus) +
          '<div class="status-explain">Internal processing state. Ours alone; the counterparty ' +
            'never sees it.</div>' +
          '<div class="status-meta">' + manualNote + '</div>' +
          (readOnly ? '' :
            '<div class="ctl-row">' +
              '<select class="ctl" id="workStatusSelect">' +
                '<option value="">Change to…</option>' + opts +
              '</select>' +
              '<input class="ctl" id="workStatusReason" placeholder="Reason (optional)" ' +
                'style="min-width:170px;" />' +
              '<button class="btn btn-primary" id="btnSetStatus">Set</button>' +
              resyncBtn +
            '</div>') +
          '<div class="msg" id="statusMsg"></div>' +
        '</div>' +
      '</div>' +

      exceptionPanel() +
      nextActionBlock() +

      '<div class="hdr-reason">' +
        '<span class="label">Reason for referral</span>' +
        orEmpty(ref.reasonForReferral, 'None recorded') +
      '</div>' +

      '<div class="hdr-grid">' +
        field('Initiating organization', ref.referrerAddress) +
        field('Receiving department', ref.routingDepartment) +
        field('Owner', ws.ownerDisplayName, 'Unassigned') +
        field('Queue', ws.queueName, 'Unassigned') +
        field('360X referral id', ws.externalReferralId) +
        field('Received', fmtDate(ref.createdAt)) +
        (ref.state === 'Declined' ? field('Decline reason', ref.declineReason) : '') +
      '</div>';

    if (!readOnly) {
      document.getElementById('btnSetStatus').addEventListener('click', setStatus);
      var rb = document.getElementById('btnResync');
      if (rb) rb.addEventListener('click', resync);
    }
    wireNextAction();
  }

  function showMsg(text, ok) {
    var el = document.getElementById('statusMsg');
    el.className = 'msg ' + (ok ? 'ok' : 'err');
    el.textContent = text;
  }

  async function post(url, body) {
    var res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {})
    });
    var json = await res.json().catch(function () { return {}; });
    return { ok: res.ok, status: res.status, json: json };
  }

  async function setStatus() {
    var select = document.getElementById('workStatusSelect');
    var next = select.value;
    if (!next) { showMsg('Pick a status first.', false); return; }

    var btn = document.getElementById('btnSetStatus');
    btn.disabled = true;
    showMsg('Saving…', true);

    var reason = document.getElementById('workStatusReason').value.trim();
    var r = await post('/api/workspaces/' + encodeURIComponent(ws.id) + '/work-status',
      reason ? { workStatus: next, reason: reason } : { workStatus: next });

    if (r.ok) {
      showMsg('Work status set to ' + next + '.', true);
      location.reload();
      return;
    }
    btn.disabled = false;
    var detail = r.json && r.json.allowedWorkStatuses
      ? ' Allowed from here: ' + r.json.allowedWorkStatuses.join(', ') + '.'
      : '';
    showMsg((r.json && r.json.error ? r.json.error : 'Failed to set work status.') + detail, false);
  }

  async function resync() {
    var btn = document.getElementById('btnResync');
    btn.disabled = true;
    showMsg('Re-applying the protocol mapping…', true);

    var r = await post('/api/workspaces/' + encodeURIComponent(ws.id) + '/resync');
    if (r.ok) { location.reload(); return; }
    btn.disabled = false;
    showMsg((r.json && r.json.error) || 'Failed to resync.', false);
  }

  // ── Protocol timeline (AC9) ───────────────────────────────────────────────

  function renderTimeline() {
    // The branch a referral actually took, not a single canonical path — the
    // review page's journey timeline makes the same distinction.
    var base = ['Received', 'Acknowledged'];
    var state = ref.state;
    var path;

    if (state === 'Declined') {
      path = base.concat(['Declined']);
    } else if (state === 'Pending-Information') {
      path = base.concat(['Pending-Information']);
    } else if (state === 'Consult') {
      path = base.concat(['Accepted', 'Consult', 'Closed', 'Closed-Confirmed']);
    } else if (state === 'No-Show') {
      path = base.concat(['Accepted', 'Scheduled', 'No-Show']);
    } else {
      path = base.concat(['Accepted', 'Scheduled', 'Encounter', 'Closed', 'Closed-Confirmed']);
    }

    var idx = path.indexOf(state);
    var steps = path.map(function (label, i) {
      var cls = 'tl-dot';
      if (label === 'Declined' && state === 'Declined') cls += ' declined';
      else if (label === 'No-Show' && state === 'No-Show') cls += ' noshown';
      else if (idx >= 0 && i === idx) cls += ' current';
      else if (idx >= 0 && i < idx) cls += ' active';

      var conn = (idx >= 0 && i < idx) ? ' active' : '';
      return '<div class="tl-step">' +
        '<div class="tl-connector' + conn + '"></div>' +
        '<div class="' + cls + '">' + (idx >= 0 && i < idx ? '✓' : String(i + 1)) + '</div>' +
        '<div class="tl-label">' + esc(label) + '</div>' +
      '</div>';
    }).join('');

    document.getElementById('wsTimeline').innerHTML =
      '<h2>360X Protocol Journey</h2><div class="tl">' + steps + '</div>' +
      '<div class="status-explain" style="max-width:none;margin-top:10px;">' +
        'The externally authoritative lifecycle. Work status is tracked separately and ' +
        'does not appear here.</div>';
  }

  // ── Message thread (AC10) — same endpoints, unchanged ─────────────────────

  function formatMessageType(type) {
    var map = {
      ReferralCCDA: 'Referral C-CDA', RRI: 'RRI Response', SIU: 'Scheduling Notice',
      InterimUpdate: 'Interim Update', ConsultNote: 'Consult Note',
      ConsultRequest: 'Consultation Request', NoShowNotification: 'No-Show Notice',
      InfoRequest: 'Info Request', InfoReply: 'Info Reply', ACK: 'Acknowledgment',
      MDN: 'Delivery Notification'
    };
    return map[type] || type;
  }

  async function loadThread() {
    var host = document.getElementById('wsThread');
    host.innerHTML = '<h2>Exchanged Messages <span class="thread-count" id="threadCount"></span></h2>' +
      '<div id="threadLoading" class="thread-no-content">Loading…</div>' +
      '<div class="thread-container" id="threadContainer" style="display:none;"></div>';

    var container = document.getElementById('threadContainer');
    var loading = document.getElementById('threadLoading');

    try {
      var res = await fetch('/api/referrals/' + encodeURIComponent(ref.id) + '/thread');
      if (!res.ok) throw new Error('thread fetch failed');
      var json = await res.json();
      var thread = json.thread || [];

      loading.style.display = 'none';
      container.style.display = 'flex';
      document.getElementById('threadCount').textContent = '(' + thread.length + ')';

      if (thread.length === 0) {
        container.innerHTML = '<div class="thread-no-content">No messages recorded for this referral.</div>';
        return;
      }

      thread.forEach(function (msg) {
        var entry = document.createElement('div');
        entry.className = 'thread-entry ' + msg.direction;

        var ackBadge = '';
        if (msg.ackStatus && msg.direction === 'outbound') {
          ackBadge = '<span class="thread-ack ' +
            (msg.ackStatus === 'Acknowledged' ? 'acked' : 'pending') + '">' +
            (msg.ackStatus === 'Acknowledged' ? '✓ ACK\'d' : '⏳ Pending') + '</span>';
        }

        var ts = typeof msg.createdAt === 'number'
          ? new Date(msg.createdAt * 1000) : new Date(msg.createdAt);

        entry.innerHTML =
          '<div class="thread-header">' +
            '<span class="thread-arrow">▶</span>' +
            '<span class="thread-dir-badge ' + msg.direction + '">' +
              (msg.direction === 'inbound' ? 'IN' : 'OUT') + '</span>' +
            '<span class="thread-type">' + esc(formatMessageType(msg.messageType)) + '</span>' +
            ackBadge +
            '<span class="thread-time">' + esc(ts.toLocaleString(undefined, {
              month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
            })) + '</span>' +
          '</div>' +
          '<div class="thread-summary">' + esc(msg.summary) + '</div>' +
          '<div class="thread-body"></div>';

        var body = entry.querySelector('.thread-body');
        entry.addEventListener('click', function () {
          entry.classList.toggle('expanded');
          if (entry.classList.contains('expanded') && !body.dataset.loaded) {
            loadThreadContent(msg, body);
          }
        });

        container.appendChild(entry);
      });
    } catch (err) {
      loading.textContent = 'Failed to load message thread.';
      console.error('[Workspace/Thread]', err);
    }
  }

  /** Lazy, one fetch per message, cached by the dataset flag. */
  async function loadThreadContent(msg, bodyEl) {
    if (!msg.hasContent) {
      bodyEl.innerHTML = '<div class="thread-no-content">Content not recorded for this message.</div>';
      bodyEl.dataset.loaded = '1';
      return;
    }
    bodyEl.innerHTML = '<div class="thread-no-content">Loading content…</div>';
    try {
      var res = await fetch('/api/referrals/' + encodeURIComponent(ref.id) +
        '/thread/' + encodeURIComponent(msg.id) + '/content');
      if (!res.ok) throw new Error('content fetch failed');
      var json = await res.json();
      var isHl7 = /^(MSH|RRI|SIU|ADT|ORU)/.test(String(json.content || '').trim());
      bodyEl.innerHTML = '<div class="' + (isHl7 ? 'thread-body-hl7' : 'thread-body-text') + '">' +
        esc(json.content || '(empty)') + '</div>';
      bodyEl.dataset.loaded = '1';
    } catch (err) {
      bodyEl.innerHTML = '<div class="thread-no-content">Failed to load content.</div>';
      console.error('[Workspace/ThreadContent]', err);
    }
  }

  function ownerMsg(text, ok) {

  async function ownerAction(payload) {
    var reasonEl = document.getElementById('ownerReason');
    var reason = reasonEl ? reasonEl.value.trim() : '';
    if (reason) payload.reason = reason;

    ownerMsg('Saving\u2026', true);
    var r = await post('/api/workspaces/' + encodeURIComponent(ws.id) + '/owner', payload);
    if (r.ok) { location.reload(); return; }

    // 409 on a claim carries the winner; say who rather than just "failed".
    var msg = (r.json && r.json.error) || 'Could not change the owner.';
    if (r.status === 409 && r.json && r.json.currentOwnerDisplayName) {
      msg = 'Already claimed by ' + r.json.currentOwnerDisplayName + '.';
    }
    ownerMsg(msg, false);
  }
