  // ── Protocol assertions (PRD-29) ──────────────────────────────────────────
  //
  // The authoring surface. What it offers comes from the SERVER, derived from
  // the assertion catalog for this party's role and the referral's protocol
  // state — never a list written here. The gateway re-checks from the same
  // catalog, so this cannot offer something that would then be refused.

  var available = { available: [], partyRole: null, protocolState: null };
  var assertions = [];

  function renderAssertions() {
    var readOnly = !!P.workspace.archivedAt;

    var options = (available.available || []).map(function (a) {
      // Only the context this assertion actually requires gets a field. A
      // scheduling form on an accept button would be noise.
      var fields = (a.requiredContext || []).map(function (c) {
        return '<input class="ctl" id="ctx-' + esc(a.type) + '-' + esc(c) + '" placeholder="' +
          esc(CTX_LABEL[c] || c) + '" style="min-width:170px;" />';
      }).join('');

      return '<div class="asrt">' +
        '<div class="asrt-top">' +
          '<span class="asrt-label">' + esc(a.label) + '</span>' +
        '</div>' +
        '<div class="asrt-desc">' + esc(a.description) + '</div>' +
        (readOnly ? '' :
          '<div class="asrt-ctx">' + fields +
            '<button class="btn btn-primary" data-assert="' + esc(a.type) + '">Send</button>' +
          '</div>') +
      '</div>';
    }).join('');

    var history = assertions.length === 0 ? '' :
      '<div class="subhead">Artifacts sent from here</div>' +
      '<ul class="hist">' + assertions.map(function (a) {
        var cls = a.deliveryStatus === 'Failed' ? 'del-failed'
          : (a.deliveryMode === 'local-only' ? 'del-local' : 'del-transmitted');
        var label = a.deliveryMode === 'local-only' ? 'recorded, not sent' : a.deliveryStatus.toLowerCase();
        return '<li>' +
          '<span style="font-weight:600;">' + esc(a.assertionType) + '</span>' +
          '<span class="tag ' + cls + '">' + esc(label) + '</span>' +
          (a.toState ? '<span class="p-meta">' + esc(a.fromState) + ' \u2192 ' + esc(a.toState) + '</span>' : '') +
          '<span class="p-spacer"></span>' +
          '<span class="p-meta">' + esc(new Date(a.createdAt).toLocaleString()) + '</span>' +
          // AC11: transmitting a previously local-only artifact is an explicit
          // action, so it needs an explicit button.
          (!readOnly && (a.deliveryMode === 'local-only' || a.deliveryStatus === 'Failed')
            ? '<button class="btn" data-transmit="' + esc(a.assertionId) + '">Send now</button>' : '') +
        '</li>';
      }).join('') + '</ul>';

    document.getElementById('wsAssertions').innerHTML =
      '<h2>360X Actions</h2>' +
      (available.protocolState
        ? '<div class="party-extra" style="margin-bottom:10px;">Acting for this organization as the <strong>' +
          esc(available.partyRole || '\u2014') + '</strong> party. The referral is ' +
          esc(available.protocolState) + '.</div>'
        : '') +
      (options || '<div class="asrt-none">Nothing to send from this state. The other side acts next, ' +
        'or the referral is finished.</div>') +
      history +
      '<div class="msg" id="asrtMsg"></div>' +
      '<div class="party-extra">Each action is turned into a conformant 360X artifact and delivered to ' +
      'the other organization\u2019s Direct address. If they have no address on file it is still ' +
      'recorded here, and you can send it later.</div>';

    if (readOnly) return;

    Array.prototype.forEach.call(document.querySelectorAll('[data-assert]'), function (btn) {
      btn.addEventListener('click', function () { sendAssertion(btn.getAttribute('data-assert')); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-transmit]'), function (btn) {
      btn.addEventListener('click', function () { retransmit(Number(btn.getAttribute('data-transmit'))); });
    });
  }

  var CTX_LABEL = {
    reason: 'Reason (sent to them)',
    note: 'Note',
    appointmentDate: 'Appointment date/time',
    location: 'Location',
    assessment: 'Assessment',
    plan: 'Plan',
    chiefComplaint: 'Chief complaint'
  };

  function asrtMsg(text, ok) {
    var el = document.getElementById('asrtMsg');
    if (!el) return;
    el.className = 'msg ' + (ok ? 'ok' : 'err');
    el.textContent = text;
  }

  async function sendAssertion(type) {
    var spec = (available.available || []).filter(function (a) { return a.type === type; })[0];
    if (!spec) return;

    var context = {};
    for (var i = 0; i < (spec.requiredContext || []).length; i++) {
      var c = spec.requiredContext[i];
      var input = document.getElementById('ctx-' + type + '-' + c);
      var v = input ? input.value.trim() : '';
      if (!v) { asrtMsg((CTX_LABEL[c] || c) + ' is required — it is sent to the other side.', false); return; }
      context[c] = v;
    }

    try {
      var res = await fetch('/api/workspaces/' + ws.id + '/assertions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        // A key generated per click, so a double-click replays rather than
        // emitting a second artifact.
        body: JSON.stringify({ assertionType: type, assertionKey: ws.id + '-' + type + '-' + Date.now(), context: context })
      });
      var json = await res.json();
      if (!res.ok) { asrtMsg(json.error || 'Could not send that.', false); return; }
      await reloadAssertions();
      asrtMsg(json.deliveryMode === 'local-only'
        ? 'Recorded. The other organization has no Direct address on file, so nothing was transmitted.'
        : 'Sent as a conformant 360X artifact.', true);
    } catch (err) {
      asrtMsg('Could not send that: ' + err.message, false);
    }
  }

  async function retransmit(assertionId) {
    try {
      var res = await fetch('/api/workspaces/' + ws.id + '/assertions/' + assertionId + '/transmit', { method: 'POST' });
      var json = await res.json();
      if (!res.ok) { asrtMsg(json.error || 'Could not send it.', false); return; }
      await reloadAssertions();
      asrtMsg(json.deliveryMode === 'transmitted' ? 'Sent.' : 'Still no address on file for them.', json.deliveryMode === 'transmitted');
    } catch (err) {
      asrtMsg('Could not send it: ' + err.message, false);
    }
  }

  async function reloadAssertions() {
    try {
      var both = await Promise.all([
        fetch('/api/workspaces/' + ws.id + '/assertions/available').then(function (r) { return r.json(); }),
        fetch('/api/workspaces/' + ws.id + '/assertions').then(function (r) { return r.json(); })
      ]);
      available = both[0] || { available: [] };
      assertions = both[1].assertions || [];
    } catch (err) {
      console.warn('[Workspace/Assertions]', err);
    }
    renderAssertions();
  }

  // ── Parties & participants (PRD-24) ───────────────────────────────────────

  /**
   * Plain-language protocol mode (AC5). Deliberately describes CONSEQUENCE
   * rather than restating the enum: "native-360x" tells a coordinator nothing,
   * "artifacts go straight to their system" tells them what will happen when
   * they act.
   */
  var MODE_TEXT = {
    'native-360x': 'Their own system speaks 360X \u2014 artifacts are delivered straight to it.',
    'workspace-mediated': 'They have a Direct address but no 360X system, so they work inside this workspace and we render conformant artifacts to that address.',
    'local-only': 'No Direct address on file, so updates stay local \u2014 artifacts are still generated and stored, but nothing is transmitted.'
  };

  var MODE_LABEL = {
    'native-360x': 'Speaks 360X',
    'workspace-mediated': 'Works in this workspace',
    'local-only': 'Local only'
  };

  /** Active users for the add-participant picker. */
  var rosterUsers = [];

  function renderParties() {
    var parties = P.parties || [];
    var participants = P.participants || [];
    var readOnly = !!P.workspace.archivedAt;

    var partyHtml = parties.length === 0
      // An empty parties list is a signal, not a normal state: seeding runs on
      // creation, so emptiness means this workspace predates PRD-24 and the
      // backfill has not been run. Say that rather than showing nothing.
      ? '<div class="empty-note">No parties recorded. This workspace was created before ' +
        'parties existed \u2014 run <code>npm run backfill:parties</code>.</div>'
      : parties.map(function (p) {
          var verified = p.capabilityVerifiedAt
            ? '<span class="tag verified" title="Confirmed by a real exchange">verified</span>'
            : '<span class="tag assumed" title="Not yet confirmed by an actual exchange">assumed</span>';

          // Only addresses BEYOND the canonical intake are worth listing; the
          // intake address is already shown on its own line above.
          var extra = (p.addresses || []).filter(function (a) {
            return !p.directAddress || a.address.toLowerCase() !== p.directAddress.toLowerCase();
          });

          var modeCtl = readOnly ? '' :
            '<div class="ctl-row">' +
              '<select class="ctl party-mode-sel" data-party="' + esc(p.id) + '">' +
                Object.keys(MODE_LABEL).map(function (m) {
                  return '<option value="' + esc(m) + '"' + (p.protocolMode === m ? ' selected' : '') + '>' +
                    esc(MODE_LABEL[m]) + '</option>';
                }).join('') +
              '</select>' +
              '<button class="btn party-mode-btn" data-party="' + esc(p.id) + '">Set mode</button>' +
            '</div>';

          return '<div class="party">' +
            '<div class="party-top">' +
              '<span class="party-role ' + esc(p.partyRole) + '">' + esc(p.partyRole) + '</span>' +
              '<span class="party-name">' + esc(p.orgName) + '</span>' +
              (p.orgNameVerified ? '' : '<span class="tag" title="Derived from the address domain, not confirmed">unverified name</span>') +
              verified +
            '</div>' +
            '<div class="party-addr">' + (p.directAddress ? esc(p.directAddress) : 'no Direct address') + '</div>' +
            '<div class="party-mode">' + esc(MODE_TEXT[p.protocolMode] || p.protocolMode) + '</div>' +
            (extra.length === 0 ? '' :
              '<div class="party-extra">Also seen using: ' +
              extra.map(function (a) { return esc(a.address); }).join(', ') + '</div>') +
            (p.contactName ? '<div class="party-extra">Contact: ' + esc(p.contactName) + '</div>' : '') +
            modeCtl +
            renderInviteBlock(p) +
          '</div>';
        }).join('');

    var listHtml = participants.length === 0
      ? '<div class="empty-note">Nobody else is on this referral yet.</div>'
      : '<ul class="plist">' + participants.map(function (m) {
          return '<li>' +
            '<span class="p-name">' + esc(m.displayName) + '</span>' +
            '<span class="p-role">' + esc(m.role) + '</span>' +
            (m.isOwner ? '<span class="tag verified" title="The accountable owner">owner</span>' : '') +
            (m.inactive ? '<span class="tag" title="No longer active">inactive</span>' : '') +
            '<span class="p-meta">' + esc(m.jobRole) + '</span>' +
            '<span class="p-spacer"></span>' +
            // AC10: the owner cannot be removed, so no button is offered rather
            // than offering one that 409s.
            (readOnly || m.isOwner ? '' :
              '<button class="btn-x" data-remove="' + esc(m.userId) + '" title="Remove from this referral">\u00D7</button>') +
          '</li>';
        }).join('') + '</ul>';

    var addCtl = readOnly ? '' :
      '<div class="ctl-row">' +
        '<select class="ctl" id="pAddUser"><option value="">Add somebody\u2026</option>' +
          rosterUsers.filter(function (u) {
            return !participants.some(function (m) { return m.userId === u.id; });
          }).map(function (u) {
            return '<option value="' + esc(u.id) + '">' + esc(u.displayName) + ' \u00B7 ' + esc(u.jobRole) + '</option>';
          }).join('') +
        '</select>' +
        '<select class="ctl" id="pAddRole">' +
          '<option value="Collaborator">Collaborator</option>' +
          '<option value="Manager">Manager</option>' +
          '<option value="Viewer">Viewer</option>' +
        '</select>' +
        '<button class="btn" id="pAddBtn">Add</button>' +
      '</div>';

    document.getElementById('wsParticipants').innerHTML =
      '<h2>Parties &amp; Participants</h2>' +
      '<div class="subhead" style="margin-top:2px;">Organizations on this referral</div>' +
      partyHtml +
      '<div class="subhead">People here who are involved</div>' +
      listHtml +
      addCtl +
      '<div class="msg" id="pMsg"></div>' +
      // Stated on the page, not just in the code: somebody will otherwise
      // assume Viewer is a permission.
      '<div class="party-extra">Roles describe involvement and drive notifications. They are ' +
      'not access control yet \u2014 queue membership (PRD-20) and guest scoping (PRD-30) are what ' +
      'will enforce who can see what.</div>';

    if (readOnly) return;

    Array.prototype.forEach.call(document.querySelectorAll('.party-mode-btn'), function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-party');
        var sel = document.querySelector('.party-mode-sel[data-party="' + id + '"]');
        if (sel) setMode(id, sel.value);
      });
    });

    bindInviteControls();

    var addBtn = document.getElementById('pAddBtn');
    if (addBtn) addBtn.addEventListener('click', function () {
      var u = document.getElementById('pAddUser');
      var r = document.getElementById('pAddRole');
      if (!u.value) { pMsg('Pick somebody first.', false); return; }
      addPerson(Number(u.value), r.value);
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-remove]'), function (btn) {
      btn.addEventListener('click', function () {
        removePerson(Number(btn.getAttribute('data-remove')));
      });
    });
  }

  function pMsg(text, ok) {
    var el = document.getElementById('pMsg');
    if (!el) return;
    el.className = 'msg ' + (ok ? 'ok' : 'err');
    el.textContent = text;
  }

  async function setMode(partyId, mode) {
    try {
      var res = await fetch('/api/workspaces/' + ws.id + '/parties/' + partyId + '/protocol-mode', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ protocolMode: mode })
      });
      var json = await res.json();
      if (!res.ok) { pMsg(json.error || 'Could not set the mode.', false); return; }
      await reloadParties();
      pMsg('Protocol mode updated.', true);
    } catch (err) {
      pMsg('Could not set the mode: ' + err.message, false);
    }
  }

  async function addPerson(userId, role) {
    try {
      var res = await fetch('/api/workspaces/' + ws.id + '/participants', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: userId, role: role })
      });
      var json = await res.json();
      if (!res.ok) { pMsg(json.error || 'Could not add them.', false); return; }
      await reloadParties();
      pMsg('Added.', true);
    } catch (err) {
      pMsg('Could not add them: ' + err.message, false);
    }
  }

  async function removePerson(userId) {
    try {
      var res = await fetch('/api/workspaces/' + ws.id + '/participants/' + userId, { method: 'DELETE' });
      var json = await res.json();
      if (!res.ok) { pMsg(json.error || 'Could not remove them.', false); return; }
      await reloadParties();
      pMsg('Removed. Anything they wrote is kept.', true);
    } catch (err) {
      pMsg('Could not remove them: ' + err.message, false);
    }
  }

  // ── Invitations (PRD-30) ──────────────────────────────────────────────────
  //
  // Lives in this panel because you invite a PARTY, and the parties are here.
  // A separate panel would have separated the organization from the act of
  // giving it access.

  var invitations = [];

  function inviteRowsFor(partyId) {
    return invitations.filter(function (i) { return i.partyId === partyId; });
  }

  function renderInviteBlock(p) {
    var rows = inviteRowsFor(p.id);
    var readOnly = !!P.workspace.archivedAt;

    var list = rows.length === 0 ? '' :
      '<ul class="plist" style="margin-top:8px;">' + rows.map(function (i) {
        var when = new Date(i.expiresAt);
        // Status is computed server-side so the panel and the guard cannot
        // disagree about whether a link still works.
        var tagClass = i.status === 'accepted' ? 'tag verified'
          : (i.status === 'pending' ? 'tag' : 'tag assumed');
        return '<li>' +
          '<span class="p-meta" style="font-family:ui-monospace,monospace;">' + esc(i.recipientEmail) + '</span>' +
          '<span class="' + tagClass + '">' + esc(i.status) + '</span>' +
          (i.emailDelivered ? '' : '<span class="tag" title="SMTP did not accept it; the invitation still exists">undelivered</span>') +
          '<span class="p-spacer"></span>' +
          '<span class="p-meta">' + (i.status === 'expired' ? 'expired ' : 'until ') + esc(when.toLocaleDateString()) + '</span>' +
          (readOnly || i.status === 'revoked' ? '' :
            '<button class="btn" data-reissue="' + esc(i.id) + '" title="Issue a new link and invalidate this one">Re-issue</button>' +
            '<button class="btn-x" data-revoke="' + esc(i.id) + '" title="End access immediately">\u00D7</button>') +
        '</li>';
      }).join('') + '</ul>';

    if (readOnly) return list;

    return list +
      '<div class="ctl-row">' +
        '<input class="ctl" id="inviteEmail-' + esc(p.id) + '" placeholder="' +
          (p.directAddress ? esc(p.directAddress) : 'email address') +
          '" style="min-width:220px;" />' +
        '<button class="btn" data-invite="' + esc(p.id) + '">Invite</button>' +
      '</div>';
  }

  function bindInviteControls() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-invite]'), function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-invite');
        var input = document.getElementById('inviteEmail-' + id);
        // The party's own intake address is the sensible default, so an empty
        // field means "send it there" rather than being an error.
        var email = (input && input.value.trim()) || input.getAttribute('placeholder');
        if (!email || email.indexOf('@') === -1) { pMsg('Enter an email address.', false); return; }
        sendInvite(Number(id), email);
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-revoke]'), function (btn) {
      btn.addEventListener('click', function () { revokeInvite(Number(btn.getAttribute('data-revoke'))); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-reissue]'), function (btn) {
      btn.addEventListener('click', function () { reissueInvite(Number(btn.getAttribute('data-reissue'))); });
    });
  }

  async function sendInvite(partyId, recipientEmail) {
    try {
      var res = await fetch('/api/workspaces/' + ws.id + '/invitations', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ partyId: partyId, recipientEmail: recipientEmail })
      });
      var json = await res.json();
      if (!res.ok) { pMsg(json.error || 'Could not send the invitation.', false); return; }
      await reloadParties();
      // Deliberately does not show a link: the server never returns the token,
      // so there is nothing to display even if we wanted to.
      pMsg(json.emailDelivered
        ? 'Invitation emailed to ' + recipientEmail + '.'
        : 'Invitation created, but the email could not be sent. Use Re-issue to try again.', json.emailDelivered);
    } catch (err) {
      pMsg('Could not send the invitation: ' + err.message, false);
    }
  }

  async function revokeInvite(invitationId) {
    try {
      var res = await fetch('/api/workspaces/' + ws.id + '/invitations/' + invitationId, { method: 'DELETE' });
      var json = await res.json();
      if (!res.ok) { pMsg(json.error || 'Could not revoke it.', false); return; }
      await reloadParties();
      pMsg('Access ended. Their next request is refused, even with the page open.', true);
    } catch (err) {
      pMsg('Could not revoke it: ' + err.message, false);
    }
  }

  async function reissueInvite(invitationId) {
    try {
      var res = await fetch('/api/workspaces/' + ws.id + '/invitations/' + invitationId + '/reissue', { method: 'POST' });
      var json = await res.json();
      if (!res.ok) { pMsg(json.error || 'Could not re-issue it.', false); return; }
      await reloadParties();
      pMsg('New link sent. The previous one no longer works.', true);
    } catch (err) {
      pMsg('Could not re-issue it: ' + err.message, false);
    }
  }

  /** Re-reads both lists from the server rather than patching them locally. */
  async function reloadParties() {
    try {
      var all = await Promise.all([
        fetch('/api/workspaces/' + ws.id + '/parties').then(function (r) { return r.json(); }),
        fetch('/api/workspaces/' + ws.id + '/participants').then(function (r) { return r.json(); }),
        fetch('/api/workspaces/' + ws.id + '/invitations').then(function (r) { return r.json(); })
      ]);
      P.parties = all[0].parties || [];
      P.participants = all[1].participants || [];
      invitations = all[2].invitations || [];
    } catch (err) {
      console.warn('[Workspace/Parties]', err);
    }
    renderParties();
  }

  async function loadRoster() {
    try {
      var res = await fetch('/api/users');
      var json = await res.json();
      rosterUsers = json.users || json || [];
    } catch (err) {
      rosterUsers = [];
      console.warn('[Workspace/Parties]', err);
    }
    renderParties();
  }

  // ── Conversation (PRD-22) ─────────────────────────────────────────────────

  var comments = [];
  var openMentions = 0;
  var mentionRoster = { users: [], parties: [] };
  var draftMentions = [];   // [{ kind, id, displayName }]
  var editingId = null;
  var historyFor = null;
  var historyRows = [];

  function visLabel(v) {
    return v === 'Shared' ? 'Shared' : 'Internal';
  }

  /** Who a shared comment actually reaches. Drives the confirmation wording. */
  function sharedWith() {
    return (mentionRoster.parties || []).filter(function (p) {
      return p.partyRole !== 'receiving';
    });
  }

  function renderShareWarning() {
    var targets = sharedWith();
    var list = targets.length === 0
      ? '<li>Nobody yet — no other organization is recorded on this referral.</li>'
      : targets.map(function (p) {
          return '<li><strong>' + esc(p.orgName) + '</strong> — ' +
            (p.hasLiveInvitation
              ? 'has a live invitation, so somebody there can read this now'
              : 'has no live invitation yet, so nobody there can read it until one is sent') +
            '</li>';
        }).join('');

    return '<div class="share-warn">' +
      'This comment will be readable by everyone your organization invites to this referral, ' +
      'and by:' +
      '<ul>' + list + '</ul>' +
      '<label><input type="checkbox" id="cmtConfirm"> ' +
        'I mean to share this outside my organization.</label>' +
    '</div>';
  }

  function mentionOptions(visibility) {
    // Internal comments mention colleagues; shared comments mention
    // organizations. The two lists never mix, which is the rule that stops a
    // colleague's name reaching the other side.
    if (visibility === 'Shared') {
      return (mentionRoster.parties || []).map(function (p) {
        return { kind: 'party', id: p.id, displayName: p.orgName };
      });
    }
    return (mentionRoster.users || []).map(function (u) {
      return {
        kind: 'user',
        id: u.id,
        displayName: u.displayName + (u.isParticipant ? '' : ' — not yet on this referral'),
      };
    });
  }

  function renderConversation() {
    var readOnly = !!P.workspace.archivedAt;
    var visibility = (document.getElementById('cmtVis') || {}).value || 'Internal';

    var thread = comments.length === 0
      ? '<div class="empty-note">Nothing written down yet. Notes you add here stay internal ' +
        'unless you share them.</div>'
      : comments.map(function (c) { return renderComment(c, readOnly); }).join('');

    var opts = mentionOptions(visibility);
    var chips = draftMentions.map(function (m, i) {
      return '<span class="chip">' + esc(m.displayName) +
        '<button type="button" class="cmt-chip-x" data-i="' + esc(i) + '" ' +
        'aria-label="Remove mention">×</button></span>';
    }).join('');

    var composer = readOnly
      ? '<div class="empty-note">This workspace is archived. The conversation is read-only.</div>'
      : '<div class="cmp">' +
          '<textarea id="cmtBody" maxlength="4000" placeholder="What did you learn? ' +
            'Anything you write here is internal unless you share it."></textarea>' +
          '<div class="ctl-row">' +
            '<select class="ctl" id="cmtVis">' +
              '<option value="Internal"' + (visibility === 'Internal' ? ' selected' : '') + '>' +
                'Internal — my organization only</option>' +
              '<option value="Shared"' + (visibility === 'Shared' ? ' selected' : '') + '>' +
                'Shared — the other organization can read it</option>' +
            '</select>' +
            (opts.length === 0 ? '' :
              '<select class="ctl" id="cmtMention">' +
                '<option value="">Mention…</option>' +
                opts.map(function (o) {
                  return '<option value="' + esc(o.kind) + ':' + esc(o.id) + '">' +
                    esc(o.displayName) + '</option>';
                }).join('') +
              '</select>') +
            '<button class="btn btn-primary" id="cmtPost">Post</button>' +
            '<span class="cmp-count" id="cmtCount"></span>' +
          '</div>' +
          (chips ? '<div>' + chips + '</div>' : '') +
          (visibility === 'Shared' ? renderShareWarning() : '') +
          '<div class="msg" id="cmtMsg"></div>' +
        '</div>';

    var badge = openMentions > 0
      ? '<div class="ctl-row">' +
          '<span class="tag assumed">' + esc(openMentions) +
            (openMentions === 1 ? ' mention waiting for you' : ' mentions waiting for you') +
          '</span>' +
          '<button class="btn" id="cmtAck">Mark as read</button>' +
        '</div>'
      : '';

    document.getElementById('wsConversation').innerHTML =
      '<h2>Conversation</h2>' + badge + thread + composer;

    bindConversation();
  }

  function renderComment(c, readOnly) {
    var cls = c.deleted ? 'cmt-deleted' : (c.visibility === 'Shared' ? 'cmt-shared' : 'cmt-internal');
    var visCls = c.visibility === 'Shared' ? 'cmt-vis-shared' : 'cmt-vis-internal';

    var who = esc(c.authorDisplayName) +
      (c.authorKind === 'guest'
        ? ' <span class="cmt-meta">(guest' +
          (c.authorPartyOrgName ? ' at ' + esc(c.authorPartyOrgName) : '') + ')</span>'
        : (c.authorJobRole ? ' <span class="cmt-meta">(' + esc(c.authorJobRole) + ')</span>' : '')) +
      (c.authorInactive ? ' <span class="tag">no longer active</span>' : '');

    var when = fmtDateTime(c.createdAt) +
      (c.editedAt ? ' · edited ' + fmtDateTime(c.editedAt) +
        ' (revision ' + esc(c.revisionCount) + ')' : '');

    var body = c.deleted
      ? '<div class="cmt-gone">This comment was deleted' +
        (c.deletedByActor ? ' by ' + esc(actorLabel(c.deletedByActor)) : '') +
        (c.deletedAt ? ' on ' + fmtDateTime(c.deletedAt) : '') +
        '. The wording is kept in the revision history.</div>'
      : '<div class="cmt-body">' + esc(c.body) + '</div>';

    var mentions = (c.mentions || []).length === 0 ? '' :
      '<div class="cmt-mentions">Mentioned: ' +
        c.mentions.map(function (m) {
          return esc(m.displayName) + (m.acknowledgedAt ? ' ✓' : '');
        }).join(', ') +
      '</div>';

    var editing = editingId === c.id;
    var acts = [];
    if (!readOnly && !c.deleted && !editing) {
      // Only the author is offered the edit control, because only the author can
      // use it — the server refuses anybody else regardless of what is rendered.
      if (c.authorKind === 'user' && P.actingUser && c.authorUserId === P.actingUser.id) {
        acts.push('<button class="btn cmt-edit" data-id="' + esc(c.id) + '">Edit</button>');
      }
      acts.push('<button class="btn cmt-del" data-id="' + esc(c.id) + '">Delete</button>');
    }
    if (c.revisionCount > 1 || c.deleted) {
      acts.push('<button class="btn cmt-hist-btn" data-id="' + esc(c.id) + '">' +
        (historyFor === c.id ? 'Hide history' : 'History') + '</button>');
    }

    var editor = !editing ? '' :
      '<textarea class="cmt-edit-area" id="cmtEdit' + esc(c.id) + '" maxlength="4000">' +
        esc(c.body) + '</textarea>' +
      '<div class="ctl-row">' +
        '<select class="ctl" id="cmtEditVis' + esc(c.id) + '">' +
          '<option value="Internal"' + (c.visibility === 'Internal' ? ' selected' : '') + '>Internal</option>' +
          '<option value="Shared"' + (c.visibility === 'Shared' ? ' selected' : '') + '>Shared</option>' +
        '</select>' +
        '<button class="btn btn-primary cmt-save" data-id="' + esc(c.id) + '">Save</button>' +
        '<button class="btn cmt-cancel">Cancel</button>' +
      '</div>' +
      (c.visibility === 'Internal'
        ? '<div class="mention-flag">Changing this to Shared shares it with the other ' +
          'organization. You will be asked to confirm.</div>'
        : (c.shareLocked
            ? '<div class="mention-flag">This can no longer be made internal: someone ' +
              'outside your organization has already had access to it.</div>'
            : ''));

    var hist = historyFor !== c.id ? '' :
      '<div class="cmt-hist">' +
        historyRows.map(function (r) {
          return '<div><strong>Revision ' + esc(r.revisionNumber) + '</strong> · ' +
            esc(visLabel(r.visibility)) + ' · ' + fmtDateTime(r.createdAt) + ' · ' +
            esc(actorLabel(r.createdByActor)) + '<br>' + esc(r.body) + '</div>';
        }).join('') +
      '</div>';

    return '<div class="cmt ' + cls + '">' +
      '<div class="cmt-top">' +
        '<span class="cmt-author">' + who + '</span>' +
        '<span class="cmt-vis ' + visCls + '">' + esc(visLabel(c.visibility)) + '</span>' +
        '<span class="cmt-meta">' + esc(when) + '</span>' +
      '</div>' +
      (editing ? editor : body) +
      mentions +
      (acts.length ? '<div class="cmt-acts">' + acts.join('') + '</div>' : '') +
      hist +
    '</div>';
  }

  /** 'user:5' / 'guest:2' / 'system' rendered for a human. */
  function actorLabel(actor) {
    var raw = String(actor == null ? '' : actor);
    var m = /^user:(\d+)$/.exec(raw);
    if (m) {
      var found = (mentionRoster.users || []).filter(function (u) {
        return String(u.id) === m[1];
      })[0];
      return found ? found.displayName : raw;
    }
    if (/^guest:/.test(raw)) return 'a guest';
    return raw;
  }

  function fmtDateTime(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    return isNaN(d.getTime()) ? String(iso) : d.toLocaleString();
  }

  function cMsg(text, ok) {
    var el = document.getElementById('cmtMsg');
    if (!el) return;
    el.textContent = text;
    el.style.color = ok ? '#0a7d4b' : 'var(--color-priority)';
  }

  function bindConversation() {
    var vis = document.getElementById('cmtVis');
    if (vis) {
      vis.addEventListener('change', function () {
        // Switching visibility drops mentions that the new visibility forbids,
        // and says so rather than silently discarding them.
        var want = vis.value === 'Shared' ? 'party' : 'user';
        var before = draftMentions.length;
        draftMentions = draftMentions.filter(function (m) { return m.kind === want; });
        var body = (document.getElementById('cmtBody') || {}).value || '';
        renderConversation();
        var ta = document.getElementById('cmtBody');
        if (ta) ta.value = body;
        if (before !== draftMentions.length) {
          cMsg('Mentions that do not apply to a ' + vis.value.toLowerCase() +
            ' comment were removed.', false);
        }
      });
    }

    var pick = document.getElementById('cmtMention');
    if (pick) {
      pick.addEventListener('change', function () {
        if (!pick.value) return;
        var parts = pick.value.split(':');
        var opts = mentionOptions((document.getElementById('cmtVis') || {}).value || 'Internal');
        var found = opts.filter(function (o) {
          return o.kind === parts[0] && String(o.id) === parts[1];
        })[0];
        var already = draftMentions.some(function (m) {
          return m.kind === parts[0] && String(m.id) === parts[1];
        });
        if (found && !already) {
          draftMentions.push({ kind: found.kind, id: found.id, displayName: found.displayName });
        }
        var body = (document.getElementById('cmtBody') || {}).value || '';
        renderConversation();
        var ta = document.getElementById('cmtBody');
        if (ta) ta.value = body;
      });
    }

    Array.prototype.forEach.call(document.querySelectorAll('.cmt-chip-x'), function (b) {
      b.addEventListener('click', function () {
        draftMentions.splice(parseInt(b.getAttribute('data-i'), 10), 1);
        var body = (document.getElementById('cmtBody') || {}).value || '';
        renderConversation();
        var ta = document.getElementById('cmtBody');
        if (ta) ta.value = body;
      });
    });

    var ta = document.getElementById('cmtBody');
    var count = document.getElementById('cmtCount');
    if (ta && count) {
      var tick = function () {
        count.textContent = ta.value.length > 3600 ? ta.value.length + ' / 4000' : '';
      };
      ta.addEventListener('input', tick);
      tick();
    }

    var post = document.getElementById('cmtPost');
    if (post) post.addEventListener('click', submitComment);

    var ack = document.getElementById('cmtAck');
    if (ack) ack.addEventListener('click', ackMentions);

    Array.prototype.forEach.call(document.querySelectorAll('.cmt-edit'), function (b) {
      b.addEventListener('click', function () {
        editingId = parseInt(b.getAttribute('data-id'), 10);
        renderConversation();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.cmt-cancel'), function (b) {
      b.addEventListener('click', function () { editingId = null; renderConversation(); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.cmt-save'), function (b) {
      b.addEventListener('click', function () { saveEdit(parseInt(b.getAttribute('data-id'), 10)); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.cmt-del'), function (b) {
      b.addEventListener('click', function () { removeComment(parseInt(b.getAttribute('data-id'), 10)); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.cmt-hist-btn'), function (b) {
      b.addEventListener('click', function () { toggleHistory(parseInt(b.getAttribute('data-id'), 10)); });
    });
  }

  function mentionPayload() {
    return {
      users: draftMentions.filter(function (m) { return m.kind === 'user'; })
        .map(function (m) { return m.id; }),
      parties: draftMentions.filter(function (m) { return m.kind === 'party'; })
        .map(function (m) { return m.id; }),
    };
  }

  async function submitComment() {
    var ta = document.getElementById('cmtBody');
    var vis = document.getElementById('cmtVis');
    var confirmBox = document.getElementById('cmtConfirm');
    var body = ta ? ta.value : '';
    var visibility = vis ? vis.value : 'Internal';

    if (!body.trim()) { cMsg('Write something first.', false); return; }
    if (visibility === 'Shared' && !(confirmBox && confirmBox.checked)) {
      cMsg('Tick the confirmation before sharing this outside your organization.', false);
      return;
    }

    try {
      const res = await fetch('/api/workspaces/' + P.workspace.id + '/comments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          body: body,
          visibility: visibility,
          confirmShared: visibility === 'Shared',
          mentions: mentionPayload(),
        }),
      });
      const data = await res.json();
      if (!res.ok) { cMsg(data.error || 'Could not post that.', false); return; }
      draftMentions = [];
      await reloadComments();
      cMsg('Posted.', true);
    } catch (err) {
      cMsg('Network error.', false);
      console.warn('[Workspace/Comments]', err);
    }
  }

  async function saveEdit(commentId) {
    var ta = document.getElementById('cmtEdit' + commentId);
    var vis = document.getElementById('cmtEditVis' + commentId);
    var existing = comments.filter(function (c) { return c.id === commentId; })[0];
    if (!ta || !vis || !existing) return;

    var becomingShared = existing.visibility === 'Internal' && vis.value === 'Shared';
    if (becomingShared) {
      var targets = sharedWith().map(function (p) { return p.orgName; }).join(', ');
      // The composer's confirmation is a tick-box; an edit's is a dialog, for
      // the same reason: sharing must be a separate deliberate act.
      if (!window.confirm('Share this comment with ' +
          (targets || 'the other organization') + '? They will be able to read it.')) {
        return;
      }
    }

    try {
      const res = await fetch(
        '/api/workspaces/' + P.workspace.id + '/comments/' + commentId,
        {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            body: ta.value,
            visibility: vis.value,
            confirmShared: becomingShared,
          }),
        },
      );
      const data = await res.json();
      if (!res.ok) { cMsg(data.error || 'Could not save that.', false); return; }
      editingId = null;
      await reloadComments();
      cMsg('Saved.', true);
    } catch (err) {
      cMsg('Network error.', false);
      console.warn('[Workspace/Comments]', err);
    }
  }

  async function removeComment(commentId) {
    if (!window.confirm('Delete this comment? The wording is kept in the revision history ' +
        'and the deletion is recorded against you.')) {
      return;
    }
    try {
      const res = await fetch(
        '/api/workspaces/' + P.workspace.id + '/comments/' + commentId,
        { method: 'DELETE' },
      );
      const data = await res.json();
      if (!res.ok) { cMsg(data.error || 'Could not delete that.', false); return; }
      await reloadComments();
      cMsg('Deleted.', true);
    } catch (err) {
      cMsg('Network error.', false);
      console.warn('[Workspace/Comments]', err);
    }
  }

  async function toggleHistory(commentId) {
    if (historyFor === commentId) { historyFor = null; historyRows = []; renderConversation(); return; }
    try {
      const res = await fetch(
        '/api/workspaces/' + P.workspace.id + '/comments/' + commentId + '/history',
      );
      const data = await res.json();
      historyRows = res.ok ? (data.revisions || []) : [];
      historyFor = commentId;
    } catch (err) {
      historyRows = [];
      historyFor = commentId;
      console.warn('[Workspace/Comments]', err);
    }
    renderConversation();
  }

  async function ackMentions() {
    try {
      await fetch('/api/workspaces/' + P.workspace.id + '/mentions/ack', { method: 'POST' });
      await reloadComments();
    } catch (err) {
      console.warn('[Workspace/Comments]', err);
    }
  }

  async function reloadComments() {
    try {
      const res = await fetch('/api/workspaces/' + P.workspace.id + '/comments');
      const data = await res.json();
      comments = res.ok ? (data.comments || []) : [];
      openMentions = res.ok ? (data.openMentions || 0) : 0;
    } catch (err) {
      comments = [];
      openMentions = 0;
      console.warn('[Workspace/Comments]', err);
    }
    renderConversation();
  }

  async function loadConversation() {
    // Targets FIRST: renderComment() resolves actor strings and mention labels
    // through the roster, so fetching them in parallel would render a first
    // frame full of bare ids.
    await loadMentionTargets();
    await reloadComments();
  }

  async function loadMentionTargets() {
    try {
      const res = await fetch('/api/workspaces/' + P.workspace.id + '/mention-targets');
      const data = await res.json();
      if (res.ok) mentionRoster = { users: data.users || [], parties: data.parties || [] };
    } catch (err) {
      console.warn('[Workspace/Comments]', err);
    }
  }

  // ── Documents (PRD-23) ────────────────────────────────────────────────────

  var documents = [];
  var docFilter = { source: '', type: '' };
  var openDoc = null;      // { id, mode: 'ccda' | 'text' | 'log', body }

  var SRC_LABEL = {
    'inbound-dsm': 'received',
    'outbound-dsm': 'sent',
    'generated': 'not sent',
    'uploaded': 'uploaded',
    'payer-outbound': 'to payer',
    'payer-inbound': 'from payer',
  };

  function srcClass(source) {
    if (source === 'inbound-dsm') return 'doc-src-inbound';
    if (source === 'outbound-dsm') return 'doc-src-outbound';
    if (source === 'uploaded') return 'doc-src-upload';
    if (source === 'payer-outbound' || source === 'payer-inbound') return 'doc-src-payer';
    return '';
  }

  function visibleDocs() {
    return documents.filter(function (d) {
      if (docFilter.source && d.source !== docFilter.source) return false;
      if (docFilter.type && d.docType !== docFilter.type) return false;
      return true;
    });
  }

  function uniqueValues(key) {
    var seen = {};
    documents.forEach(function (d) { seen[d[key]] = true; });
    return Object.keys(seen).sort();
  }

  function renderDocuments() {
    var readOnly = !!P.workspace.archivedAt;
    var shown = visibleDocs();

    var filters = documents.length === 0 ? '' :
      '<div class="doc-filters">' +
        '<select class="ctl" id="docSrcFilter">' +
          '<option value="">Every source</option>' +
          uniqueValues('source').map(function (v) {
            return '<option value="' + esc(v) + '"' + (docFilter.source === v ? ' selected' : '') +
              '>' + esc(SRC_LABEL[v] || v) + '</option>';
          }).join('') +
        '</select>' +
        '<select class="ctl" id="docTypeFilter">' +
          '<option value="">Every type</option>' +
          uniqueValues('docType').map(function (v) {
            return '<option value="' + esc(v) + '"' + (docFilter.type === v ? ' selected' : '') +
              '>' + esc(v) + '</option>';
          }).join('') +
        '</select>' +
      '</div>';

    var body;
    if (documents.length === 0) {
      body = '<div class="empty-note">No documents on this referral yet. If this workspace ' +
        'predates the document index, run <code>npm run backfill:documents</code>.</div>';
    } else if (shown.length === 0) {
      body = '<div class="empty-note">No documents match those filters.</div>';
    } else {
      body = shown.map(renderDocument).join('');
    }

    var upload = readOnly
      ? ''
      : '<div class="doc-upload">' +
          '<div class="subhead">Add a document</div>' +
          '<div class="ctl-row">' +
            '<input type="file" id="docFile" accept=".pdf,.jpg,.jpeg,.png,.xml">' +
          '</div>' +
          '<div class="ctl-row">' +
            '<input class="ctl" id="docLabel" type="text" placeholder="What is it? e.g. Prior imaging report" style="min-width:200px;">' +
            '<select class="ctl" id="docVis">' +
              '<option value="Internal">Internal — my organization only</option>' +
              '<option value="Shared">Shared — the other organization can read it</option>' +
            '</select>' +
            '<button class="btn btn-primary" id="docUpload">Upload</button>' +
          '</div>' +
          '<div class="doc-note">Uploading never sends anything. To send a document to the other ' +
            'organization, attach 360X context to it from the assertions panel.</div>' +
          '<div class="msg" id="docMsg"></div>' +
        '</div>';

    document.getElementById('wsDocuments').innerHTML =
      '<h2>Documents</h2>' + filters + body + upload;

    bindDocuments();
  }

  function renderDocument(d) {
    var patient = d.scope === 'patient';
    var opened = openDoc && openDoc.id === d.id;

    var meta = [
      d.senderOrgName || d.senderAddress || 'unknown sender',
      fmtDateTime(d.receivedAt),
      d.protocolRelationship || null,
      d.originalFilename || null,
    ].filter(function (x) { return !!x; }).map(esc).join(' · ');

    // Two facts, side by side, never merged: a HISP delivery receipt is not
    // evidence that a person read the document.
    var delivery = d.deliveryStatus === null
      ? (d.source === 'inbound-dsm' || d.source === 'payer-inbound'
          ? 'n/a — we received this'
          : 'n/a')
      : esc(d.deliveryStatus) + (d.deliveredAt ? ' · ' + esc(fmtDateTime(d.deliveredAt)) : '');

    var access = (d.accessCount.internal + d.accessCount.guest) === 0
      ? 'nobody yet'
      : esc(d.accessCount.internal) + ' internal, ' + esc(d.accessCount.guest) + ' guest' +
        (d.lastAccessedAt ? ' · ' + esc(fmtDateTime(d.lastAccessedAt)) : '');

    var acts = [];
    if (d.renderAs === 'ccda') {
      acts.push('<button class="btn doc-open" data-id="' + esc(d.id) + '" data-mode="ccda">' +
        (opened && openDoc.mode === 'ccda' ? 'Close' : 'Open') + '</button>');
    } else if (d.renderAs === 'text') {
      acts.push('<button class="btn doc-open" data-id="' + esc(d.id) + '" data-mode="text">' +
        (opened && openDoc.mode === 'text' ? 'Close' : 'Open') + '</button>');
    }
    acts.push('<a class="btn" href="/api/documents/' + esc(d.id) + '/content?download=1">Download</a>');
    acts.push('<button class="btn doc-open" data-id="' + esc(d.id) + '" data-mode="log">' +
      (opened && openDoc.mode === 'log' ? 'Hide access' : 'Who opened it') + '</button>');

    var panel = '';
    if (opened && openDoc.mode === 'ccda') {
      panel = '<iframe class="doc-frame" src="/documents/' + esc(d.id) + '/ccda-frame" ' +
        'title="Document viewer"></iframe>';
    } else if (opened && openDoc.mode === 'text') {
      panel = '<div class="doc-pre">' + esc(openDoc.body || 'Loading…') + '</div>';
    } else if (opened && openDoc.mode === 'log') {
      panel = (openDoc.log || []).length === 0
        ? '<div class="doc-note">Nobody has opened this document.</div>'
        : '<ul class="doc-log">' + openDoc.log.map(function (a) {
            return '<li>' + esc(a.viewerDisplayName || 'unidentified') + ' — ' + esc(a.action) +
              (a.reason ? ' (' + esc(a.reason) + ')' : '') +
              ' · ' + esc(fmtDateTime(a.viewedAt)) + '</li>';
          }).join('') + '</ul>';
    }

    return '<div class="doc' + (patient ? ' doc-patient' : '') + '">' +
      '<div class="doc-top">' +
        '<span class="doc-src ' + srcClass(d.source) + '">' + esc(SRC_LABEL[d.source] || d.source) + '</span>' +
        '<span class="doc-type">' + esc(d.docType) + '</span>' +
        (d.visibility === 'Shared'
          ? '<span class="cmt-vis cmt-vis-shared">Shared</span>'
          : '<span class="cmt-vis cmt-vis-internal">Internal</span>') +
        (patient
          ? '<span class="tag assumed" title="Filed against this patient, not this referral">patient-level</span>'
          : '') +
      '</div>' +
      '<div class="doc-meta">' + meta + '</div>' +
      '<div class="doc-evidence">' +
        '<div class="doc-fact"><span class="k">Delivery</span>' + delivery + '</div>' +
        '<div class="doc-fact"><span class="k">Opened by</span>' + access + '</div>' +
      '</div>' +
      '<div class="doc-acts">' + acts.join('') + '</div>' +
      panel +
    '</div>';
  }

  function docMsg(text, ok) {
    var el = document.getElementById('docMsg');
    if (!el) return;
    el.textContent = text;
    el.style.color = ok ? '#0a7d4b' : 'var(--color-priority)';
  }

  function bindDocuments() {
    var srcSel = document.getElementById('docSrcFilter');
    if (srcSel) srcSel.addEventListener('change', function () {
      docFilter.source = srcSel.value;
      renderDocuments();
    });
    var typeSel = document.getElementById('docTypeFilter');
    if (typeSel) typeSel.addEventListener('change', function () {
      docFilter.type = typeSel.value;
      renderDocuments();
    });

    Array.prototype.forEach.call(document.querySelectorAll('.doc-open'), function (b) {
      b.addEventListener('click', function () {
        toggleDocument(parseInt(b.getAttribute('data-id'), 10), b.getAttribute('data-mode'));
      });
    });

    var up = document.getElementById('docUpload');
    if (up) up.addEventListener('click', doUpload);
  }

  async function toggleDocument(documentId, mode) {
    if (openDoc && openDoc.id === documentId && openDoc.mode === mode) {
      openDoc = null;
      renderDocuments();
      return;
    }
    openDoc = { id: documentId, mode: mode };

    if (mode === 'text') {
      renderDocuments();
      try {
        const res = await fetch('/api/documents/' + documentId + '/content');
        openDoc.body = res.ok ? await res.text() : 'This document could not be displayed.';
      } catch (err) {
        openDoc.body = 'This document could not be displayed.';
        console.warn('[Workspace/Documents]', err);
      }
    } else if (mode === 'log') {
      try {
        const res = await fetch('/api/documents/' + documentId + '/access-log');
        const data = await res.json();
        openDoc.log = res.ok ? (data.access || []) : [];
      } catch (err) {
        openDoc.log = [];
        console.warn('[Workspace/Documents]', err);
      }
    }
    renderDocuments();
    // Opening a document is itself an access event, so the counts just changed.
    if (mode !== 'log') void reloadDocuments();
  }

  async function doUpload() {
    var input = document.getElementById('docFile');
    var label = document.getElementById('docLabel');
    var vis = document.getElementById('docVis');
    var file = input && input.files && input.files[0];
    if (!file) { docMsg('Choose a file first.', false); return; }

    try {
      // The raw file as the body. encodeURIComponent on the header values
      // because HTTP headers are latin-1 and a filename is not.
      const res = await fetch('/api/workspaces/' + P.workspace.id + '/documents', {
        method: 'POST',
        headers: {
          'Content-Type': file.type || 'application/octet-stream',
          'X-Document-Filename': encodeURIComponent(file.name),
          'X-Document-Type': encodeURIComponent(label ? label.value : ''),
          'X-Document-Visibility': vis ? vis.value : 'Internal',
        },
        body: file,
      });
      const data = await res.json();
      if (!res.ok) { docMsg(data.error || 'Could not upload that.', false); return; }
      if (input) input.value = '';
      if (label) label.value = '';
      await reloadDocuments();
      docMsg('Uploaded. Nothing was sent to the other organization.', true);
    } catch (err) {
      docMsg('Network error.', false);
      console.warn('[Workspace/Documents]', err);
    }
  }

  async function reloadDocuments() {
    try {
      const res = await fetch('/api/workspaces/' + P.workspace.id + '/documents');
      const data = await res.json();
      documents = res.ok ? (data.documents || []) : [];
    } catch (err) {
      documents = [];
      console.warn('[Workspace/Documents]', err);
    }
    // Whatever the reader has open survives the re-render: openDoc is module
    // state, not markup, so it is re-applied rather than lost.
    renderDocuments();
  }

  // ── Activity history (PRD-25) ─────────────────────────────────────────────

  var activity = { entries: [], counts: {}, total: 0 };
  var actKind = '';

  var KIND_LABEL = {
    '': 'Everything',
    system: 'System',
    user: 'People here',
    guest: 'The other side',
    status: 'Status',
    delivery: 'Delivery',
    access: 'Opened',
  };

  // Delivery and access are worded, not just coloured: "delivered" and "opened
  // by a person" are different claims and the feed must not let a reader
  // conflate them.
  var EVIDENCE_LABEL = { delivery: 'delivery receipt', access: 'human access' };

  function renderActivity() {
    var counts = activity.counts || {};
    var tabs = ['', 'status', 'user', 'guest', 'delivery', 'access', 'system'].map(function (k) {
      var n = k === '' ? activity.total : (counts[k] || 0);
      // Every tab shows its UNFILTERED count, so you can see there are three
      // guest entries while looking at the status tab.
      return '<button class="act-tab' + (actKind === k ? ' on' : '') + '" data-kind="' + esc(k) + '">' +
        esc(KIND_LABEL[k]) + '<span class="n">' + esc(n) + '</span></button>';
    }).join('');

    var body = activity.entries.length === 0
      ? '<div class="empty-note">' +
        (actKind ? 'Nothing of that kind yet.' : 'Nothing recorded against this referral yet.') +
        '</div>'
      : activity.entries.map(renderActivityEntry).join('');

    document.getElementById('wsActivity').innerHTML =
      '<h2>Activity History</h2><div class="act-tabs">' + tabs + '</div>' + body;

    Array.prototype.forEach.call(document.querySelectorAll('.act-tab'), function (b) {
      b.addEventListener('click', function () {
        actKind = b.getAttribute('data-kind');
        void reloadActivity();
      });
    });
  }

  function renderActivityEntry(e) {
    var transition = (e.fromState && e.toState)
      ? '<span class="act-transition">' + esc(e.fromState) + ' → ' + esc(e.toState) + '</span>'
      : '';
    var evidence = e.evidence
      ? '<span class="act-chip act-ev-' + esc(e.evidence) + '">' + esc(EVIDENCE_LABEL[e.evidence]) + '</span>'
      : '';
    var artifact = e.artifact
      ? '<span class="act-meta">' + esc(e.artifact.kind) + ': ' + esc(e.artifact.label) + '</span>'
      : '';

    return '<div class="act act-' + esc(e.kind) + '">' +
      '<div class="act-rail"></div>' +
      '<div class="act-body">' +
        '<div class="act-line">' + esc(e.summary) + ' ' + evidence + '</div>' +
        '<div class="act-meta">' +
          esc(e.actorLabel) + ' · ' + esc(fmtDateTime(e.occurredAt)) +
          (transition ? ' · ' + transition : '') +
        '</div>' +
        artifact +
      '</div>' +
    '</div>';
  }

  async function reloadActivity() {
    try {
      const q = actKind ? '?kind=' + encodeURIComponent(actKind) : '';
      const res = await fetch('/api/workspaces/' + P.workspace.id + '/activity' + q);
      const data = await res.json();
      activity = res.ok ? data : { entries: [], counts: {}, total: 0 };
    } catch (err) {
      activity = { entries: [], counts: {}, total: 0 };
      console.warn('[Workspace/Activity]', err);
    }
    renderActivity();
  }

  function renderSlots() {
    if (!P.slots.owner) {
      renderSlot('wsOwner', 'Ownership', 'PRD-21',
        'Claim, assign and release this workspace. Owner is shown in the header meanwhile.');
    }
    if (!P.slots.conversation) {
      renderSlot('wsConversation', 'Conversation', 'PRD-22',
        'Threaded discussion between both parties, with mentions.');
    }
    if (!P.slots.documents) {
      renderSlot('wsDocuments', 'Documents', 'PRD-23',
        'The shared document collection, beyond the inbound referral C-CDA.');
    }
    if (!P.slots.activity) {
      renderSlot('wsActivity', 'Activity History', 'PRD-25',
        'Every state change, proposal and message, resolved to who did it.');
    }
  }

  // ── Boot ──────────────────────────────────────────────────────────────────

  document.title = 'Workspace #' + ws.id + ' — ' +
    (P.patient.lastName || 'Referral ' + ref.id);

  renderBanners();
  renderHeader();
  renderTimeline();
  renderRouting();
  renderClinical();
  renderPriorAuth();
  renderCcda();
  renderSlots();
  if (P.slots.owner) loadOwnerUsers();
  if (P.slots.participants) { renderParties(); loadRoster(); reloadParties(); }
  if (P.slots.conversation) { renderConversation(); loadConversation(); }
  if (P.slots.documents) { renderDocuments(); void reloadDocuments(); }
  if (P.slots.activity) { renderActivity(); void reloadActivity(); }
  reloadAssertions();
  loadThread();
})();
</script>
